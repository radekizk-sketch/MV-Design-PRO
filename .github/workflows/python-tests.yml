# Frontend checks (type-check, lint, tests, codenames guard) are in frontend-checks.yml
name: Python tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Pelna historia jest WYMAGANA: `tests/ci/test_guard_diff_base.py` sprawdza
          # sciezke produkcyjna guardow delta-owych na REALNYM repozytorium, a klon
          # glebokosci 1 nie ma ani `origin/main`, ani `HEAD~1` — guard poprawnie
          # zglasza wtedy brak bazy (fail-closed), wiec test pada. Bez tego ustawienia
          # workflow byl czerwony od V12K-199 na tym jednym tescie (V12K-205).
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.x'
          cache: pip
          cache-dependency-path: mv-design-pro/backend/poetry.lock
      - name: Install Poetry
        run: pipx install poetry
      - name: Cache Poetry and virtualenv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ runner.os }}-${{ hashFiles('mv-design-pro/backend/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-
      - name: Install dependencies
        working-directory: mv-design-pro/backend
        run: poetry install --no-interaction --with dev
      - name: Run pytest
        working-directory: mv-design-pro/backend
        run: poetry run pytest -q
      # KD-9: testy WLASNE guardow leza w `mv-design-pro/scripts`, czyli POZA
      # `testpaths = ["tests"]` backendu — `poetry run pytest -q` powyzej nigdy
      # ich nie zbieral, a zaden workflow ich nie wolal. 10 plikow / 71 testow
      # bylo martwych od powstania: znaleziono to przy naprawie
      # `api_lifecycle_guard.py`, ktorego test kontraktu jest wlasnie w tym
      # zbiorze. Jeden z tych testow zdazyl w tym czasie zgnic (rejestr decyzji
      # w atrapie nie nadazyl za kanonem V12D-036) — nikt tego nie widzial,
      # bo test sie nie wykonywal. Czas biegu: ~2 s.
      - name: Testy guardow (mv-design-pro/scripts, poza testpaths backendu)
        working-directory: mv-design-pro/backend
        run: poetry run python -m pytest -q ../scripts
      - name: Run audit2 backend integration tests (Phase 8-30)
        working-directory: mv-design-pro/backend
        run: |
          poetry run pytest -q \
            tests/api/test_audit2_catalogs_api.py \
            tests/api/test_audit2_station_config_api.py \
            tests/api/test_solver_input_audit2_integration.py \
            tests/solver_input/test_audit2_der_payload.py \
            tests/solver_input/test_audit2_solver_adjuster.py \
            tests/solver_input/test_audit2_real_graph_integration.py \
            tests/solver_input/test_audit2_pf_wrapper.py \
            tests/solver_input/test_audit2_builder_integration.py \
            tests/proof_engine/test_audit2_validation_pack.py \
            tests/analysis/reporting/test_audit2_report.py
      - name: PCC Zero Guard
        working-directory: mv-design-pro
        run: python scripts/pcc_zero_guard.py
      - name: Domain No-Guessing Guard
        working-directory: mv-design-pro
        run: python scripts/domain_no_guessing_guard.py
      - name: Canonical Operations Guard
        working-directory: mv-design-pro
        run: python scripts/canonical_ops_guard.py
      - name: Readiness Codes Guard
        working-directory: mv-design-pro
        run: python scripts/readiness_codes_guard.py
      # V12K-206 (karta F-K6): guard KONSUMPCJI kodow gotowosci. Wymaga zaleznosci
      # backendu (importuje rejestr), dlatego biegnie tu, a nie w workflow guardow.
      - name: Readiness Consumption Guard
        working-directory: mv-design-pro/backend
        run: poetry run python ../scripts/readiness_consumption_guard.py
      - name: Catalog Binding Guard
        working-directory: mv-design-pro
        run: python scripts/catalog_binding_guard.py
      - name: Catalog Enforcement Guard
        working-directory: mv-design-pro/backend
        run: poetry run python ../scripts/catalog_enforcement_guard.py
      - name: Catalog Gate Guard
        working-directory: mv-design-pro
        run: python scripts/catalog_gate_guard.py
      - name: Transformer Catalog Voltage Guard
        working-directory: mv-design-pro/backend
        run: poetry run python ../scripts/transformer_catalog_voltage_guard.py
      - name: Fix Action Completeness Guard
        working-directory: mv-design-pro/backend
        run: poetry run python ../scripts/fix_action_completeness_guard.py
      # V12K-263: oba guardy wymagaja zaleznosci backendu (`numpy` przez
      # `application/reference_networks/computation.py`). Poza `poetry run`
      # przerywaly sie ModuleNotFoundError, wiec nikt ich nie wpial i nigdy
      # niczego nie bronily — mimo ze na HEAD sa ZIELONE. Ich miejsce jest tutaj,
      # bo tylko ten workflow instaluje srodowisko backendu.
      - name: Reference Networks Validation Guard
        working-directory: mv-design-pro/backend
        run: poetry run python ../scripts/reference_networks_validation_guard.py
      - name: Solver Output Drift Guard
        working-directory: mv-design-pro/backend
        run: poetry run python ../scripts/solver_output_drift_guard.py
      - name: Audit Contract Guard
        working-directory: mv-design-pro
        run: python scripts/audit_contract_guard.py
      # K10 (dyrektywa 2026-07-29): zero kodów rejestru/nazw API/ścieżek plików
      # w treści widocznej dla inżyniera (stringi UI + pola śladów analiz).
      - name: UI Production Codes Guard
        working-directory: mv-design-pro
        run: python scripts/ui_production_codes_guard.py
      - name: Repo Hygiene Guard
        working-directory: mv-design-pro
        run: python scripts/repo_hygiene_guard.py
      - name: Catalog Metadata Guard
        working-directory: mv-design-pro/backend
        run: poetry run python ../scripts/catalog_metadata_guard.py
      # V12K-229: parzystosc modelu ENM z lustrem TypeScript. Importuje modele,
      # dlatego biegnie w katalogu backendu (jak readiness_consumption_guard).
      - name: ENM Contract Parity Guard
        working-directory: mv-design-pro/backend
        run: poetry run python ../scripts/enm_contract_parity_guard.py
      # V12K-240: zapadka dlugu typow. `pyproject.toml` konfiguruje mypy w trybie strict,
      # ale ZADEN workflow go nie uruchamial — narzedzie skonfigurowane i nigdy nie
      # wywolane. Zapadka uruchamia mypy naprawde i pilnuje, zeby liczba bledow nie
      # urosla (dziala tez w druga strone: po poprawie zada obnizenia progu).
      - name: Mypy Ratchet Guard (dlug typow nie rosnie)
        working-directory: mv-design-pro/backend
        run: poetry run python ../scripts/mypy_ratchet_guard.py
