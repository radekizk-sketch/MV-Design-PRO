# Frontend checks (type-check, lint, tests, codenames guard) are in frontend-checks.yml
name: Python tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Pelna historia jest WYMAGANA: `tests/ci/test_guard_diff_base.py` sprawdza
          # sciezke produkcyjna guardow delta-owych na REALNYM repozytorium, a klon
          # glebokosci 1 nie ma ani `origin/main`, ani `HEAD~1` — guard poprawnie
          # zglasza wtedy brak bazy (fail-closed), wiec test pada. Bez tego ustawienia
          # workflow byl czerwony od V12K-199 na tym jednym tescie (V12K-205).
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.x'
          cache: pip
          cache-dependency-path: mv-design-pro/backend/poetry.lock
      - name: Install Poetry
        run: pipx install poetry
      - name: Cache Poetry and virtualenv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ runner.os }}-${{ hashFiles('mv-design-pro/backend/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-
      - name: Install dependencies
        working-directory: mv-design-pro/backend
        run: poetry install --no-interaction --with dev
      # Marker `pandapower` (pyproject.toml [tool.pytest.ini_options] markers):
      # walidacja krzyzowa z pandapower<3.6 wymaga scipy<1.17, niezgodne z pinem
      # scipy 1.17.0 tego venv (zlote hashe solverow). Testy oznaczone tym
      # markerem biegna WYLACZNIE w izolowanym jobie ponizej
      # (`pandapower-cross-validation`) — tu sa jawnie DESELEKCJONOWANE, nie
      # pomijane warunkowo (brak biblioteki w tym venv jest stanem stalym z
      # architektury, nie przypadkiem srodowiska).
      # Marker `andes` (karta W6-2): wyrocznia zewnetrzna dynamiki wymaga ANDES,
      # ktory NIE wchodzi do zaleznosci produkcyjnych. Testy z tym markerem biegna
      # wylacznie w jobie `andes-cross-validation` ponizej — tu sa jawnie
      # DESELEKCJONOWANE, nie pomijane warunkowo (zero skipow w glownym biegu).
      - name: Run pytest
        working-directory: mv-design-pro/backend
        run: poetry run pytest -q -m "not pandapower and not andes"
      # KD-9: testy WLASNE guardow leza w `mv-design-pro/scripts`, czyli POZA
      # `testpaths = ["tests"]` backendu — `poetry run pytest -q` powyzej nigdy
      # ich nie zbieral, a zaden workflow ich nie wolal. 10 plikow / 71 testow
      # bylo martwych od powstania: znaleziono to przy naprawie
      # `api_lifecycle_guard.py`, ktorego test kontraktu jest wlasnie w tym
      # zbiorze. Jeden z tych testow zdazyl w tym czasie zgnic (rejestr decyzji
      # w atrapie nie nadazyl za kanonem V12D-036) — nikt tego nie widzial,
      # bo test sie nie wykonywal. Czas biegu zmierzony 2026-09-24: ~6 min (2343 samotesty; samotesty strażnika werdyktu i bramki mypy uruchamiają prawdziwy parser TS i prawdziwe mypy).
      # Karta AB-1a Pakiet E1: samotest `werdykt_wyjasnialny_guard` (w kroku ponizej) parsuje
      # AST TypeScript pakietem `typescript` z `frontend/node_modules`. Bez `npm ci` ten test
      # padalby na braku parsera (blad srodowiska), a pominiecie go warunkowo byloby
      # maskowaniem (Zero-Debt pkt 1) — dlatego parser jest instalowany TU, jak w
      # `frontend-checks.yml`.
      - name: Setup Node.js (parser TypeScript dla samotestow guardow)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mv-design-pro/frontend/package-lock.json
      - name: Install frontend dependencies (parser TypeScript dla samotestow guardow)
        working-directory: mv-design-pro/frontend
        run: npm ci
      - name: Testy guardow (mv-design-pro/scripts, poza testpaths backendu)
        working-directory: mv-design-pro/backend
        run: poetry run python -m pytest -q ../scripts
      - name: Run audit2 backend integration tests (Phase 8-30)
        working-directory: mv-design-pro/backend
        run: |
          poetry run pytest -q \
            tests/api/test_audit2_catalogs_api.py \
            tests/api/test_audit2_station_config_api.py \
            tests/api/test_solver_input_audit2_integration.py \
            tests/solver_input/test_audit2_der_payload.py \
            tests/solver_input/test_audit2_solver_adjuster.py \
            tests/solver_input/test_audit2_real_graph_integration.py \
            tests/solver_input/test_audit2_pf_wrapper.py \
            tests/solver_input/test_audit2_builder_integration.py \
            tests/proof_engine/test_audit2_validation_pack.py \
            tests/analysis/reporting/test_audit2_report.py
      - name: PCC Zero Guard
        working-directory: mv-design-pro
        run: python scripts/pcc_zero_guard.py
      - name: Domain No-Guessing Guard
        working-directory: mv-design-pro
        run: python scripts/domain_no_guessing_guard.py
      - name: Canonical Operations Guard
        working-directory: mv-design-pro
        run: python scripts/canonical_ops_guard.py
      - name: Readiness Codes Guard
        working-directory: mv-design-pro
        run: python scripts/readiness_codes_guard.py
      # Karta READINESS-DOC (2026-09-09): docs/domain/READINESS_FIXACTIONS_CANONICAL_PL.md
      # (dokument WIAZACY, priorytet 3 hierarchii) jest odtad GENEROWANY z tego samego
      # rejestru co Readiness Codes Guard powyzej — ten krok pilnuje, zeby dokument nie
      # odjechal, tak jak odjechal od lutego do wersji 1.1 (37 kodow w dokumencie vs 114
      # w rejestrze).
      - name: Readiness Dictionary Guard
        working-directory: mv-design-pro
        run: python scripts/readiness_dictionary_guard.py
      # Karta W6-1 SS0 p.1/p.3: kontrakt parametrow dynamicznych (ENM +
      # katalog der_dynamic) nie moze niesc zadnej domyslki liczbowej na
      # polu fizycznym — AST po obu miejscach, ktore dziela ten sam ksztalt.
      - name: Dynamika Zero-Default Guard
        working-directory: mv-design-pro
        run: python scripts/dynamika_zero_default_guard.py
      # Karta W6-2 SS0 p.1: rdzen dynamiki RMS stoi OBOK zamrozonych rdzeni
      # solverow (B-01) i ma byc lisciem grafu importow backendu — wolno mu
      # `numpy`, `scipy.sparse`, `network_model.pochodne` i zamkniety zbior
      # modulow jezykowych stdlib, nic wiecej. Ta sama regula biegnie w
      # `solver_boundary_guard` (P0 Extended Guards) z TEJ SAMEJ implementacji.
      - name: Dynamika Import Boundary Guard
        working-directory: mv-design-pro
        run: python scripts/dynamika_granica_importow_guard.py
      # Karta AB-H0 §0.1: kontrakty dziedziny czestotliwosci (`backend/src/dziedziny/`)
      # sa lisciem grafu importow — wolno im stdlib z zamknietej listy, `pydantic`,
      # `werdykt.kontrakt` i `werdykt.proweniencja`; zadna warstwa produktu (katalog,
      # ENM, solvery, aplikacja, API). `arch_guard` nie widzi pakietu (sprawdza tylko
      # sciezki `solvers`/`analysis`), wiec ta granica ma wlasnego straznika (AST).
      - name: Dziedziny Import Boundary Guard
        working-directory: mv-design-pro
        run: python scripts/dziedziny_granica_importow_guard.py
      # CV-2-W: status wynikow PRZYPADKU jest wyprowadzany z jego biegow i koperty
      # rewizji (application/study_case/status_wynikow.py). Kolumna
      # `study_cases.result_status` to dane zastane — zaden kod jej nie pisze.
      - name: Result Status Writer Guard
        working-directory: mv-design-pro
        run: python scripts/result_status_writer_guard.py
      # CV-2 (H2/H3): pole proweniencji biegu (wersja solvera, tozsamosc katalogu,
      # wariant, migawka lacznikowa) nie moze byc literalem bez zrodla — wartosc
      # pochodzi z koperty rewizji, sladu solvera albo opcji biegu, inaczej jest None.
      - name: Provenance Constant Guard
        working-directory: mv-design-pro
        run: python scripts/provenance_constant_guard.py
      # V12K-206 (karta F-K6): guard KONSUMPCJI kodow gotowosci. Wymaga zaleznosci
      # backendu (importuje rejestr), dlatego biegnie tu, a nie w workflow guardow.
      - name: Readiness Consumption Guard
        working-directory: mv-design-pro/backend
        run: poetry run python ../scripts/readiness_consumption_guard.py
      - name: Catalog Binding Guard
        working-directory: mv-design-pro
        run: python scripts/catalog_binding_guard.py
      - name: Catalog Enforcement Guard
        working-directory: mv-design-pro/backend
        run: poetry run python ../scripts/catalog_enforcement_guard.py
      - name: Catalog Gate Guard
        working-directory: mv-design-pro
        run: python scripts/catalog_gate_guard.py
      # Karta KATALOG-NIEZMIENNIKI (2026-09-17): kazda twarda bramka rekordu
      # katalogu przechodzi przez `odmowa_twarda(kod, ...)` z kodem z rejestru
      # `niezmienniki_katalogu.py`; guard AST pilnuje klasy, nie instancji.
      - name: Niezmienniki Katalogu Guard
        working-directory: mv-design-pro
        run: python scripts/niezmienniki_katalogu_guard.py
      # Tabela gotowosci katalogow jest GENEROWANA z rejestrow repozytorium —
      # guard pilnuje, zeby dokument nie odjechal od pomiaru (wola miernik,
      # ktory importuje repozytorium, wiec potrzebuje venv backendu).
      - name: Inwentarz Katalogow Guard
        working-directory: mv-design-pro/backend
        run: poetry run python ../scripts/inwentarz_katalogow_guard.py
      # Plan A/B §12.1 (decyzja O-43, karta AB-1a Pakiet E): bramka danych wlasciciela —
      # tabela podstaw profilu NC RfG o stanie NIEUSTALONE (dokument, wydanie, jednostka
      # redakcyjna, co odblokowuje) jest GENEROWANA z profilu efektywnego kazdego operatora;
      # guard porownuje tabele w planie z pomiarem. Importuje loader profilu (pydantic,
      # yaml), wiec biegnie tu, w venv backendu, a nie w docs-guard.yml.
      - name: Bramka Danych Profilu Guard
        working-directory: mv-design-pro/backend
        run: poetry run python ../scripts/bramka_danych_profilu.py
      - name: Transformer Catalog Voltage Guard
        working-directory: mv-design-pro/backend
        run: poetry run python ../scripts/transformer_catalog_voltage_guard.py
      - name: Fix Action Completeness Guard
        working-directory: mv-design-pro/backend
        run: poetry run python ../scripts/fix_action_completeness_guard.py
      # Reference Networks Validation Guard / Solver Output Drift Guard usuniete
      # karta K2 (2026-09-09): oba czytaly WYLACZNIE dawny
      # `application.reference_networks.REFERENCE_NETWORK_REGISTRY` (has_der/
      # is_unbalanced/expected_path — pola bez odpowiednika w nowym rejestrze),
      # skasowany w calosci razem z reszta dawnego dialektu benchmarkow. Ten sam
      # rodzaj sprawdzen (buildery wykonalne, wyrocznia niezalezna ma zrodlo, PF/SC
      # w expected/*.json) niesie dzis `backend/tests/golden/test_registry.py` +
      # `backend/tests/golden/parytet_benchmarkow/test_wyrocznia_a_expected_json.py`
      # (uruchamiane w kroku pytest ponizej).
      - name: Audit Contract Guard
        working-directory: mv-design-pro
        run: python scripts/audit_contract_guard.py
      # K10 (dyrektywa 2026-07-29): zero kodów rejestru/nazw API/ścieżek plików
      # w treści widocznej dla inżyniera (stringi UI + pola śladów analiz).
      - name: UI Production Codes Guard
        working-directory: mv-design-pro
        run: python scripts/ui_production_codes_guard.py
      - name: Repo Hygiene Guard
        working-directory: mv-design-pro
        run: python scripts/repo_hygiene_guard.py
      - name: Catalog Metadata Guard
        working-directory: mv-design-pro/backend
        run: poetry run python ../scripts/catalog_metadata_guard.py
      # V12K-229: parzystosc modelu ENM z lustrem TypeScript. Importuje modele,
      # dlatego biegnie w katalogu backendu (jak readiness_consumption_guard).
      - name: ENM Contract Parity Guard
        working-directory: mv-design-pro/backend
        run: poetry run python ../scripts/enm_contract_parity_guard.py
      # V12K-240: zapadka dlugu typow. `pyproject.toml` konfiguruje mypy w trybie strict,
      # ale ZADEN workflow go nie uruchamial — narzedzie skonfigurowane i nigdy nie
      # wywolane. Zapadka uruchamia mypy naprawde i pilnuje, zeby liczba bledow nie
      # urosla (dziala tez w druga strone: po poprawie zada obnizenia progu).
      - name: Mypy Ratchet Guard (dlug typow nie rosnie)
        working-directory: mv-design-pro/backend
        run: poetry run python ../scripts/mypy_ratchet_guard.py
      # KD-9: ta sama choroba co V12K-240 wyzej, tyle ze dla formatu i lintu.
      # `pyproject.toml` konfiguruje black (line-length 100) i ruff (E,F,W,I,N,UP,B,C4),
      # CLAUDE.md podaje je jako polecenia obowiazkowe, a `grep -riE "black|ruff"`
      # po `.github/workflows/` nie znajdowal ANI JEDNEGO wywolania — narzedzia
      # skonfigurowane i nigdy nie uruchamiane. Oba sa ZIELONE na HEAD w chwili
      # wpiecia (1317 plikow bez zmian formatu, ruff bez uwag), wiec krok wchodzi
      # jako zapadka, nie jako dlug do splacenia. Stoi PO tescie, zeby usterka
      # formatu nie zabierala sygnalu z regresji.
      # V12K-301 (2026-08-01): zakres rozszerzony o `scripts/` — dlug nazwany w
      # V12K-296/297 („scripts poza zapadka") splacony: 60 plikow sformatowanych,
      # 58 uwag ruffa zamknietych (w tym DWIE martwe zmienne `pattern` — pozostalosc
      # po refaktorze, w ktorym sprawdzenie przejelo wywolanie inline w petli).
      # Dowod niezmiennosci zachowania: wyjscie WSZYSTKICH 43 guardow z
      # `p0-extended-guards.yml` bajtowo identyczne przed i po zmianie.
      - name: Format i lint backendu (black --check, ruff)
        working-directory: mv-design-pro/backend
        run: |
          poetry run black --check src tests
          poetry run ruff check src tests
          # `scripts/` lezy POZA katalogiem projektu backendu, wiec black szuka
          # konfiguracji od niego w gore i trafia na inny katalog niz nasz —
          # bez `--config` sformatowalby te pliki domyslna szerokoscia 88
          # zamiast kanonicznej 100. Dlatego OSOBNE wywolanie z jawna konfiguracja
          # (laczenie sciezek w jednym wywolaniu psuje wykrywanie tak samo).
          poetry run black --check --config pyproject.toml ../scripts
          poetry run ruff check ../scripts
          # Karta KATALOG-NIEZMIENNIKI (2026-09-17): `backend/scripts/` bylo POZA
          # zapadka formatu i lintu — ta sama choroba, ktora V12K-301 zamknal dla
          # `mv-design-pro/scripts/`. Pomiar w chwili wpiecia: 11 plikow bez zmian
          # formatu, jedna uwaga ruffa (martwy `import json` w
          # `emit_sld_network_fixture.py`) zamknieta u zrodla. Zapadka wchodzi
          # zielona, nie jako dlug do splacenia.
          poetry run black --check --config pyproject.toml scripts
          poetry run ruff check scripts

  # Decyzja Fable (opcja 2, po meldunku bramki §0 karty PANDAPOWER-DEP): walidacja
  # krzyzowa nasz solver vs pandapower biegnie w IZOLOWANYM srodowisku, ROWNOLEGLE
  # do jobu `pytest` (brak `needs:` celowo — job nie czeka na `pytest` i odwrotnie).
  # POWOD IZOLACJI: pandapower<3.6 wymaga scipy<1.17 (sprawdzone dry-runem i
  # metadanymi wheela dla 3.5.4/3.5.3/3.4.0/3.3.3/3.0.0 — kazda wersja ogranicza
  # scipy ponizej 1.17 na Pythonie 3.11), a job `pytest` powyzej pinuje scipy
  # 1.17.0 (zlote hashe solverow, FROZEN core). Instalacja pandapower w TYM jobie
  # SWIADOMIE obniza scipy do 1.16.x — WYLACZNIE w jego wlasnym, efemerycznym
  # venv, ktory znika z runnerem po zakonczeniu joba.
  #
  # IZOLACJA CACHE (nie tylko izolacja runnera): klucz cache tego joba ma
  # sufiks `-pandapower`, ROZNY od klucza joba `pytest`. Gdyby oba joby uzywaly
  # tego samego klucza `poetry-${{ runner.os }}-${{ hashFiles(...) }}`, wyscig
  # zapisu cache w tym samym biegu workflow moglby sprawic, ze PRZYSZLY bieg
  # jobu `pytest` odczytalby cache zapisany PRZEZ ten job — czyli venv z
  # obnizonym scipy trafilby do glownego venv solverow. Osobny klucz eliminuje
  # to ryzyko z konstrukcji, a nie z dyscypliny.
  pandapower-cross-validation:
    name: Pandapower cross-validation (izolowany venv, scipy<1.17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # tests/ci/test_guard_diff_base.py wymaga fetch-depth: 0 przy KAZDYM
          # checkoucie w kazdym workflowie wolajacym pytest — ten job wola
          # `poetry run pytest`, wiec podlega tej samej regule co job `pytest`
          # powyzej, mimo ze sam nie uruchamia zadnego guarda delta-owego.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.x'
          cache: pip
          cache-dependency-path: mv-design-pro/backend/poetry.lock
      - name: Install Poetry
        run: pipx install poetry
      - name: Cache Poetry and virtualenv (klucz IZOLOWANY od jobu pytest)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            ~/.cache/pypoetry/virtualenvs
          key: poetry-pandapower-${{ runner.os }}-${{ hashFiles('mv-design-pro/backend/poetry.lock') }}
          restore-keys: |
            poetry-pandapower-${{ runner.os }}-
      - name: Install dependencies
        working-directory: mv-design-pro/backend
        run: poetry install --no-interaction --with dev
      - name: Install pandapower (IZOLOWANE — obniza scipy TYLKO w tym jobie)
        working-directory: mv-design-pro/backend
        run: poetry run pip install "pandapower==3.5.4"
      # Ten sam katalog `tests` co job `pytest`, dzielony JEDNYM markerem
      # (`-m pandapower` tu, `-m "not pandapower"` tam) — zaden test nie moze
      # wypasc z obu jobow (do CV-4.3 K3b job czytal tylko
      # `tests/application/reference_networks`, wiec wyrocznia poza tym katalogiem
      # nigdy by nie pobiegla).
      - name: Run pandapower cross-validation (marker `pandapower`, caly katalog tests)
        working-directory: mv-design-pro/backend
        run: poetry run pytest -q -m pandapower tests

  # Karta W6-2 SS0 p.7 c (regula A-10): wyrocznia ZEWNETRZNA dynamiki (ANDES)
  # biegnie w IZOLOWANYM srodowisku, ROWNOLEGLE do jobu `pytest` (brak `needs:`
  # celowo). POWOD IZOLACJI: ANDES jest odniesieniem pomiarowym, nie skladnikiem
  # produktu — nie wchodzi do `pyproject` backendu, zeby zaden bieg produkcyjny
  # nie mogl od niego zalezec. Klucz cache ma sufiks `-andes`, rozny od klucza
  # jobu `pytest`, zeby venv z ANDES nie trafil do cache glownego venv solverow
  # (ta sama ostroznosc, co przy pandapower).
  #
  # Ten sam katalog `tests` co job `pytest`, dzielony JEDNYM markerem
  # (`-m andes` tu, `-m "not ... and not andes"` tam) — zaden test nie moze
  # wypasc z obu jobow.
  andes-cross-validation:
    name: Wyrocznia dynamiki ANDES (izolowany venv)
    runs-on: ubuntu-latest
    # 45 min, nie 20: od R10 ten job wykonuje takze eksperyment przyczynowy eps -> tau
    # (`tests/walidacja_fizyczna/andes/test_eps_tau.py`) — dwa zamiatania po piec biegow
    # wyroczni kazde, plus kryminalistyka zdarzenia. Zmierzony czas kompletu: ~20 min.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # tests/ci/test_guard_diff_base.py wymaga fetch-depth: 0 przy KAZDYM
          # checkoucie w kazdym workflowie wolajacym pytest.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.x'
          cache: pip
          cache-dependency-path: mv-design-pro/backend/poetry.lock
      - name: Install Poetry
        run: pipx install poetry
      - name: Cache Poetry and virtualenv (klucz IZOLOWANY od jobu pytest)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            ~/.cache/pypoetry/virtualenvs
          key: poetry-andes-${{ runner.os }}-${{ hashFiles('mv-design-pro/backend/poetry.lock') }}
          restore-keys: |
            poetry-andes-${{ runner.os }}-
      - name: Install dependencies
        working-directory: mv-design-pro/backend
        run: poetry install --no-interaction --with dev
      - name: Install ANDES (IZOLOWANE — wyrocznia, nie zaleznosc produktu)
        working-directory: mv-design-pro/backend
        run: poetry run pip install "andes==1.9.3"
      - name: Wyrocznia dynamiki (marker `andes`, caly katalog tests)
        working-directory: mv-design-pro/backend
        run: poetry run pytest -q -m andes tests

  mutacje-dynamiki:
    name: Walidacja fizyczna dynamiki — pelny zestaw mutacji
    runs-on: ubuntu-latest
    # Kazda mutacja uruchamia bramki w OSOBNYM procesie na lustrze zrodel; zestaw
    # jest zawezony do bramek, ktore deklaruje dana mutacja. POMIAR 2026-09-24 (karta
    # AB-1b.1b, M10-M37 = 28 mutacji, bramki G1-G21): harness 630 s CPU, aparat z jednego
    # wejscia (`uruchom`) 823 s CPU — razem ~24 min obliczen + instalacja; prognoza < 35 min,
    # wiec jeden job (podzial na dwa — parzyste/nieparzyste numery mutacji — dopiero, gdy
    # pomiar przekroczy 35 min). Job jest ODDZIELNY od `pytest`, zeby nie wydluzac bramki
    # obowiazkowej kazdego PR — ale jest bramka, a nie „przebiegiem na zyczenie":
    # samokontrola harnessu i trzy szybkie zabicia biegna RAZEM z reszta suity
    # (`tests/walidacja_fizyczna/test_mutacje.py`), wiec regresja harnessu jest
    # widoczna natychmiast, a ten job domyka komplet.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.x'
          cache: pip
          cache-dependency-path: mv-design-pro/backend/poetry.lock
      - name: Install Poetry
        run: pipx install poetry
      - name: Cache Poetry and virtualenv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ runner.os }}-${{ hashFiles('mv-design-pro/backend/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-
      - name: Install dependencies
        working-directory: mv-design-pro/backend
        run: poetry install --no-interaction --with dev
      - name: Pelny zestaw mutacji (kazda musi byc ZABITA albo NIEWAZNA)
        working-directory: mv-design-pro/backend
        run: |
          set -o pipefail
          poetry run python -m tests.walidacja_fizyczna.mutacje | tee /tmp/mutacje.json
          poetry run python - <<'PY'
          import json, sys
          tresc = open("/tmp/mutacje.json").read()
          podsumowanie = json.loads(tresc.split("=== PODSUMOWANIE ===", 1)[1])
          print(json.dumps(podsumowanie, indent=1))
          if podsumowanie["przezyly"] or podsumowanie["bez_zmiany_tekstu"]:
              print(
                  "MUTACJE PRZEZYLY ALBO NIE ZOSTALY NANIESIONE — zestaw bramek ma luke",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY
      - name: Aparat dowodowy z jednego wejscia (jak z czystego klonu)
        working-directory: mv-design-pro/backend
        run: poetry run python -m tests.walidacja_fizyczna.uruchom

  # ZNALEZISKO BRAMKI ADWERSARIALNEJ (2026-09-08, Z-3): dialekt PRODUKCYJNY nie mial
  # zadnego pokrycia w CI. `tests/conftest.py` wymusza SQLite dla kazdego testu, a
  # `docker-compose.yml` uruchamia backend na `postgresql+psycopg://` (DT-13:
  # „Postgres docelowo, SQLite dev/test"). Skutkiem tej luki byl CZYNNY defekt
  # `models.py::GUID.process_result_value` — bezwarunkowe `UUID(value)` przy
  # `PG_UUID(as_uuid=True)` wywalalo KAZDY odczyt kolumny GUID na Postgresie i
  # przechodzilo przez cale CI niezauwazone. Naprawa defektu bez tego joba
  # zamykalaby INSTANCJE i zostawiala KLASE (regula KLASA, NIE INSTANCJA).
  #
  # Job jest WASKI z rozmyslu: uruchamia testy oznaczone `MV_TEST_POSTGRES_URL`
  # (atomowosc przejecia biegu) plus warstwe persystencji — czyli to, co faktycznie
  # rozni sie miedzy dialektami. Nie duplikuje pelnego zestawu.
  postgres-dialect:
    name: Dialekt produkcyjny (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mvtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Ten sam powod co w jobie `pytest`: `tests/ci/test_guard_diff_base.py`
          # wymaga pelnej historii przy kazdym checkoucie wolajacym pytest.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.x'
          cache: pip
          cache-dependency-path: mv-design-pro/backend/poetry.lock
      - name: Install Poetry
        run: pipx install poetry
      - name: Cache Poetry and virtualenv (klucz IZOLOWANY od pozostalych jobow)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            ~/.cache/pypoetry/virtualenvs
          key: poetry-postgres-${{ runner.os }}-${{ hashFiles('mv-design-pro/backend/poetry.lock') }}
          restore-keys: |
            poetry-postgres-${{ runner.os }}-
      - name: Install dependencies
        working-directory: mv-design-pro/backend
        run: poetry install --no-interaction --with dev
      - name: Testy dialektu produkcyjnego (atomowosc przejecia + persystencja)
        working-directory: mv-design-pro/backend
        env:
          MV_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/mvtest
        run: >-
          poetry run pytest -q -m "not pandapower and not andes"
          tests/enm/test_przejecie_biegu_atomowe.py tests/infrastructure
