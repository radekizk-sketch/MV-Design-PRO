# Frontend checks (type-check, lint, tests, codenames guard) are in frontend-checks.yml
name: Python tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Pelna historia jest WYMAGANA: `tests/ci/test_guard_diff_base.py` sprawdza
          # sciezke produkcyjna guardow delta-owych na REALNYM repozytorium, a klon
          # glebokosci 1 nie ma ani `origin/main`, ani `HEAD~1` — guard poprawnie
          # zglasza wtedy brak bazy (fail-closed), wiec test pada. Bez tego ustawienia
          # workflow byl czerwony od V12K-199 na tym jednym tescie (V12K-205).
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.x'
          cache: pip
          cache-dependency-path: mv-design-pro/backend/poetry.lock
      - name: Install Poetry
        run: pipx install poetry
      - name: Cache Poetry and virtualenv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ runner.os }}-${{ hashFiles('mv-design-pro/backend/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-
      - name: Install dependencies
        working-directory: mv-design-pro/backend
        run: poetry install --no-interaction --with dev
      - name: Run pytest
        working-directory: mv-design-pro/backend
        run: poetry run pytest -q
      - name: Run audit2 backend integration tests (Phase 8-30)
        working-directory: mv-design-pro/backend
        run: |
          poetry run pytest -q \
            tests/api/test_audit2_catalogs_api.py \
            tests/api/test_audit2_station_config_api.py \
            tests/api/test_solver_input_audit2_integration.py \
            tests/solver_input/test_audit2_der_payload.py \
            tests/solver_input/test_audit2_solver_adjuster.py \
            tests/solver_input/test_audit2_real_graph_integration.py \
            tests/solver_input/test_audit2_pf_wrapper.py \
            tests/solver_input/test_audit2_builder_integration.py \
            tests/proof_engine/test_audit2_validation_pack.py \
            tests/analysis/reporting/test_audit2_report.py
      - name: PCC Zero Guard
        working-directory: mv-design-pro
        run: python scripts/pcc_zero_guard.py
      - name: Domain No-Guessing Guard
        working-directory: mv-design-pro
        run: python scripts/domain_no_guessing_guard.py
      - name: Canonical Operations Guard
        working-directory: mv-design-pro
        run: python scripts/canonical_ops_guard.py
      - name: Readiness Codes Guard
        working-directory: mv-design-pro
        run: python scripts/readiness_codes_guard.py
      # V12K-206 (karta F-K6): guard KONSUMPCJI kodow gotowosci. Wymaga zaleznosci
      # backendu (importuje rejestr), dlatego biegnie tu, a nie w workflow guardow.
      - name: Readiness Consumption Guard
        working-directory: mv-design-pro/backend
        run: poetry run python ../scripts/readiness_consumption_guard.py
      - name: Catalog Binding Guard
        working-directory: mv-design-pro
        run: python scripts/catalog_binding_guard.py
      - name: Catalog Enforcement Guard
        working-directory: mv-design-pro/backend
        run: poetry run python ../scripts/catalog_enforcement_guard.py
      - name: Catalog Gate Guard
        working-directory: mv-design-pro
        run: python scripts/catalog_gate_guard.py
      - name: Transformer Catalog Voltage Guard
        working-directory: mv-design-pro/backend
        run: poetry run python ../scripts/transformer_catalog_voltage_guard.py
      - name: Fix Action Completeness Guard
        working-directory: mv-design-pro/backend
        run: poetry run python ../scripts/fix_action_completeness_guard.py
      - name: Audit Contract Guard
        working-directory: mv-design-pro
        run: python scripts/audit_contract_guard.py
      - name: Repo Hygiene Guard
        working-directory: mv-design-pro
        run: python scripts/repo_hygiene_guard.py
      - name: Catalog Metadata Guard
        working-directory: mv-design-pro/backend
        run: poetry run python ../scripts/catalog_metadata_guard.py
