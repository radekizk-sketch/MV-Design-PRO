name: SLD Determinism Guards

on:
  push:
  pull_request:

jobs:
  sld-guards:
    name: SLD Guards (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.x'

      - name: Run SLD v2 determinism guards
        run: python mv-design-pro/scripts/sld_determinism_guards.py

  sld-contract-tests:
    name: SLD Contract Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mv-design-pro/frontend/package-lock.json

      - name: Install dependencies
        working-directory: mv-design-pro/frontend
        run: npm ci

      - name: Run layout engine substrate determinism tests (live topological engine)
        working-directory: mv-design-pro/frontend
        run: npx vitest run --no-file-parallelism src/ui/sld/v2/geometry/__tests__/layoutEngine.substrate.test.ts --reporter=verbose

      - name: Run ViewportController contract tests
        working-directory: mv-design-pro/frontend
        run: npx vitest run --no-file-parallelism src/ui/sld/v2/__tests__/ViewportController.test.ts --reporter=verbose

      - name: Run LodPolicy contract tests
        working-directory: mv-design-pro/frontend
        run: npx vitest run --no-file-parallelism src/ui/sld/v2/__tests__/LodPolicy.test.ts --reporter=verbose

      - name: Run renderers contract tests
        working-directory: mv-design-pro/frontend
        run: npx vitest run --no-file-parallelism src/ui/sld/v2/__tests__/renderers.test.tsx --reporter=verbose

      - name: Run port-anchored geometry substrate tests (live render path)
        working-directory: mv-design-pro/frontend
        run: npx vitest run --no-file-parallelism src/ui/sld/v2/geometry/__tests__/portAnchoredGeometry.substrate.test.ts --reporter=verbose

      - name: Run StationInternalView tests (PR-6)
        working-directory: mv-design-pro/frontend
        run: npx vitest run --no-file-parallelism src/ui/sld/v2/__tests__/StationInternalView.test.tsx --reporter=verbose

      - name: Run SldCommandService tests (PR-13)
        working-directory: mv-design-pro/frontend
        run: npx vitest run --no-file-parallelism src/ui/sld/v2/command/__tests__/SldCommandService.test.ts --reporter=verbose

      - name: Run Ports contract tests (PR-3/4)
        working-directory: mv-design-pro/frontend
        run: npx vitest run --no-file-parallelism src/ui/sld/v2/core/__tests__/ports.test.ts --reporter=verbose

      - name: Run SLD v3 render-odbiór acceptance (F7/F8b-2)
        working-directory: mv-design-pro/frontend
        run: npm run accept:sld-v3

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sld-contract-test-results
          path: mv-design-pro/frontend/test-results/
          retention-days: 30

  # NOTE (konsolidacja 2026-07): the former "SLD Render Artifacts" job invoked
  # scripts/sld_render_artifacts.ts, which rendered the *dead* BuildSequence →
  # HierarchicalLayout engine — never the live topological render path. It was
  # retired together with that dead engine. Live determinism is now guarded by
  # the layoutEngine.substrate + portAnchoredGeometry.substrate vitest steps in
  # the sld-contract-tests job above.
