name: SLD Determinism Guards

on:
  push:
  pull_request:

jobs:
  sld-guards:
    name: SLD Guards (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.x'

      - name: Run SLD v2 determinism guards
        run: python mv-design-pro/scripts/sld_determinism_guards.py

      # Karta SLD-SKALA-I-NAWIGACJA (R1/R3/R9): jedna scena niezależna od skali —
      # budowa sceny wyłącznie z migawki, zero identyfikatorów dawnych poziomów
      # szczegółu, kontrakt klas toru prądowego (wymóg 3 oceny ekranu 2/10); test
      # kontraktowy ciągłości toru uruchamiany w jobie vitest niżej.
      - name: Run SLD scale-independent scene guard (SLD-SKALA-I-NAWIGACJA)
        run: python mv-design-pro/scripts/sld_scena_niezalezna_od_skali_guard.py

      # Samotest z wstrzykniętymi regresjami: `scripts/test_sld_scena_niezalezna_od_skali_guard.py`
      # (job pytest `../scripts` w python-tests.yml).

  sld-contract-tests:
    name: SLD Contract Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mv-design-pro/frontend/package-lock.json

      - name: Install dependencies
        working-directory: mv-design-pro/frontend
        run: npm ci

      - name: Run layout engine substrate determinism tests (live topological engine)
        working-directory: mv-design-pro/frontend
        run: npx vitest run src/ui/sld/v2/geometry/__tests__/layoutEngine.substrate.test.ts --reporter=verbose

      - name: Run ViewportController contract tests
        working-directory: mv-design-pro/frontend
        run: npx vitest run src/ui/sld/v2/__tests__/ViewportController.test.ts --reporter=verbose

      - name: Run port-anchored geometry substrate tests (live render path)
        working-directory: mv-design-pro/frontend
        run: npx vitest run src/ui/sld/v2/geometry/__tests__/portAnchoredGeometry.substrate.test.ts --reporter=verbose

      - name: Run SldCommandService tests (PR-13)
        working-directory: mv-design-pro/frontend
        run: npx vitest run src/ui/sld/v2/command/__tests__/SldCommandService.test.ts --reporter=verbose

      - name: Run Ports contract tests (PR-3/4)
        working-directory: mv-design-pro/frontend
        run: npx vitest run src/ui/sld/v2/core/__tests__/ports.test.ts --reporter=verbose

      # K11-B: wyrocznia DYNAMICZNA ciągłości toru na sieci referencyjnej —
      # tor od źródła przez magistralę do każdej stacji jest wyrysowany w jednej
      # scenie (z sekcją regresji wstrzykniętej, która dowodzi, że gryzie).
      - name: Run SLD v3 track continuity contract tests (K11-B)
        working-directory: mv-design-pro/frontend
        run: npx vitest run src/ui/sld/v3/scene/__tests__/ciagloscToru.test.ts --reporter=verbose

      # K11-B: minimalny rozmiar symboli i niezależność sceny od skali — żaden
      # napis poniżej progu czytelności w całym zakresie skali kamery.
      - name: Run SLD v3 minimum symbol size contract tests (K11-B)
        working-directory: mv-design-pro/frontend
        run: npx vitest run src/ui/sld/v3/canvas/__tests__/minSymbolSize.contract.test.ts --reporter=verbose

      # KD-7: kontrakt kadru — cała rysowana treść (symbole, tory i PODPISY)
      # mieści się w kadrze z pełnym marginesem fitu, a cel fitu żyje w świecie
      # arkusza (scena + margines ramki).
      - name: Run SLD v3 content frame contract tests (KD-7)
        working-directory: mv-design-pro/frontend
        run: npx vitest run src/ui/sld/v3/canvas/__tests__/kadrTresci.contract.test.tsx --reporter=verbose

      # KD-8 poz. 5: prześwit podpisu szyny od toru (styk, nie tylko przecięcie)
      # + próg czytelności opisów jako jawna stała gramatyki.
      - name: Run SLD v3 busbar label clearance contract tests (KD-8)
        working-directory: mv-design-pro/frontend
        run: npx vitest run src/ui/sld/v3/scene/__tests__/busbarLabelClearance.test.ts --reporter=verbose

      # KD-11: tożsamość elementów na rysunku (nazwa/napięcie szyny/oznaczenie
      # pola/nazwa źródła) NIE znika przy kadrze „Dopasuj widok" — jest
      # renderowana pismem minimalnym czytelnym, bez kolizji; licznik „Ukryto N
      # opisów" liczy WYŁĄCZNIE dane szczegółowe.
      - name: Run SLD v3 identity label contract tests (KD-11)
        working-directory: mv-design-pro/frontend
        run: npx vitest run src/ui/sld/v3/canvas/__tests__/tozsamoscEtykiet.contract.test.ts --reporter=verbose

      # KD-8 poz. 1: paleta rysunku sterowana motywem — parytet kluczy,
      # semantyka klas napięć, kontrast i NIEZALEŻNOŚĆ hashu geometrii sceny
      # od motywu (paleta nie wchodzi do sceny).
      - name: Run SLD v3 theme palette contract tests (KD-8)
        working-directory: mv-design-pro/frontend
        run: npx vitest run src/ui/sld/v3/theme/__tests__/palette.test.ts --reporter=verbose

      # KD-8 poz. 2: rozłączność grup jednej warstwy narzędzi kanwy.
      - name: Run SLD v3 canvas toolbar layout contract tests (KD-8)
        working-directory: mv-design-pro/frontend
        run: npx vitest run src/ui/sld/v3/canvas/__tests__/toolbarLayout.contract.test.ts --reporter=verbose

      # S9-1 (ŁAMANIE ARKUSZA, `docs/sld/DECYZJA_LAMANIE_ARKUSZA.md`; audyt C-1):
      # podział ciągu na wiersze arkusza — punkt łamania ZAWSZE na przęśle,
      # podział pokrywa cały ciąg, prefiksowość (edycja nie przelewa arkusza),
      # determinizm.
      - name: Run SLD v3 sheet-row planner tests (S9-1)
        working-directory: mv-design-pro/frontend
        run: npx vitest run src/ui/sld/v3/layout/__tests__/sheetRows.test.ts --reporter=verbose

      # S9-1 kryteria odbioru na scenie: proporcja arkusza ≤ 2 : 1 (C-1), auto-fit
      # mieści 100 % symboli (C-2), stabilność wierszy przy edycji.
      - name: Run SLD v3 sheet-break scene contract tests (S9-1)
        working-directory: mv-design-pro/frontend
        run: npx vitest run src/ui/sld/v3/scene/__tests__/buildScene.sheetRows.test.ts --reporter=verbose

      - name: Run SLD v3 render-odbiór acceptance (F7/F8b-2)
        working-directory: mv-design-pro/frontend
        run: npm run accept:sld-v3

      # W2c: scena produkcyjna (fixtura ENM toru DER-SN -> buildSceneV3) i plan
      # etykiet kanwy w skalach produkcyjnych kamery. FAIL dla kolizji, porzuconej tozsamosci,
      # napisu poza arkuszem i braku identyfikatora aparatu bocznego na L2.
      - name: Run W2c label-plan evidence (PV + BESS + TR)
        working-directory: mv-design-pro/frontend
        run: |
          mkdir -p "$RUNNER_TEMP/sld-w2c"
          CANON_OUT="$RUNNER_TEMP/sld-w2c" npx vite-node scripts/render_schemat10_w2c.tsx

      - name: Prepare Chromium for W2c technical raster evidence
        if: always()
        working-directory: mv-design-pro/frontend
        # Ten sam setup co e2e: Playwright Chromium, a na obrazie runnera bez jego wsparcia
        # (ubuntu 26.04) Google Chrome z APT; skrypty wybierają binarkę `chromiumLaunchOptions`.
        run: npm run test:e2e:setup

      - name: Render W2c technical comparison SVG to PNG
        if: always()
        working-directory: mv-design-pro/frontend
        run: |
          if test -f "$RUNNER_TEMP/sld-w2c/w2c-l2-tor-sn.svg"; then
            CANON_OUT="$RUNNER_TEMP/sld-w2c" node scripts/rasterize.mjs
          else
            echo 'Brak SVG do zrzutu; etap W2c nie utworzył diagnostycznej sceny'
          fi

      - name: Upload W2c evidence (SVG and PNG)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sld-w2c-visual-evidence
          path: ${{ runner.temp }}/sld-w2c/
          if-no-files-found: warn
          retention-days: 14
      - name: Render operator L1 using production ENM energization overlay
        if: always()
        working-directory: mv-design-pro/frontend
        run: npx vite-node scripts/sld_v3_render_roles.mjs

      - name: Upload production SLD V3 role renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sld-v3-role-evidence
          path: mv-design-pro/docs/sld/renders/v3/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sld-contract-test-results
          path: mv-design-pro/frontend/test-results/
          retention-days: 30

  # NOTE (konsolidacja 2026-07): the former "SLD Render Artifacts" job invoked
  # scripts/sld_render_artifacts.ts, which rendered the *dead* BuildSequence →
  # HierarchicalLayout engine — never the live topological render path. It was
  # retired together with that dead engine. Live determinism is now guarded by
  # the layoutEngine.substrate + portAnchoredGeometry.substrate vitest steps in
  # the sld-contract-tests job above.
