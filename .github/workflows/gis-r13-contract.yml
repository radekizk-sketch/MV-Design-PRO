name: GIS R13 — DIGPRO → ENM → LF/SC contract

on:
  push:
    branches:
      - feature/gis-r13-digpro-enm-e2e-20261025
    paths:
      - 'mv-design-pro/tools/gis/**'
      - '.github/workflows/gis-r13-contract.yml'
  pull_request:
    paths:
      - 'mv-design-pro/tools/gis/**'
      - '.github/workflows/gis-r13-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digpro-enm-calculations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sprawdź składnię mostu i testów
        working-directory: mv-design-pro/tools/gis
        run: |
          node --check digpro_enm_e2e_r13.mjs
          node --check test_digpro_enm_e2e_r13.mjs
      - name: Uruchom testy kontraktów bez fikcyjnego backendu produkcyjnego
        working-directory: mv-design-pro/tools/gis
        run: node --test test_digpro_enm_e2e_r13.mjs

  digpro-shp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Środowisko GIS
        run: python -m pip install "geopandas>=1.0,<2" "pyogrio>=0.9,<1" "pytest>=8,<10"
      - name: Osiem prób SHP/DBF i CRS
        working-directory: mv-design-pro/tools/gis
        run: python -m pytest -q test_digpro_shp_preview_r13.py
