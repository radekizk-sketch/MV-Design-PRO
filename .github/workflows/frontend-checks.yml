name: Frontend checks

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mv-design-pro/frontend/package-lock.json
      - name: Install dependencies
        working-directory: mv-design-pro/frontend
        run: npm ci
      - name: Type check
        working-directory: mv-design-pro/frontend
        run: npm run type-check
      - name: Lint
        working-directory: mv-design-pro/frontend
        run: npm run lint
      - name: Run tests shard 1/3
        working-directory: mv-design-pro/frontend
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx vitest run --no-file-parallelism --shard=1/3
      - name: Run tests shard 2/3
        working-directory: mv-design-pro/frontend
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx vitest run --no-file-parallelism --shard=2/3
      - name: Run tests shard 3/3
        working-directory: mv-design-pro/frontend
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx vitest run --no-file-parallelism --shard=3/3
      - name: Run audit2 frontend integration tests (Phase 8-30)
        working-directory: mv-design-pro/frontend
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npx vitest run --no-file-parallelism \
            src/ui/network-build/station-der/__tests__/audit2-api.test.ts \
            src/ui/network-build/station-der/__tests__/audit2-hooks.test.tsx \
            src/ui/network-build/station-configurator/cards/__tests__/audit-round3-wiring.test.tsx \
            src/ui/network-build/station-configurator/cards/__tests__/audit-round4-wiring.test.tsx
      - name: Setup Python for codenames guard
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.x'
      - name: Codenames guard
        working-directory: mv-design-pro
        run: python scripts/no_codenames_guard.py
      - name: Dialog Completeness Guard
        working-directory: mv-design-pro
        run: python scripts/dialog_completeness_guard.py
      - name: Local Truth Guard
        working-directory: mv-design-pro
        run: python scripts/local_truth_guard.py
