name: Docs Integrity Guard

on:
  pull_request:
  push:

jobs:
  docs-guard:
    name: Documentation integrity check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run docs guard
        run: python mv-design-pro/scripts/docs_guard.py
      # Opis struktury w CLAUDE.md musi zgadzac sie z repozytorium. Ta sama klasa
      # fikcji wyszla z tego pliku trzy razy (nieistniejace testy kontraktowe SLD,
      # skasowany `designer/`, osiemnascie modulow widmo przy przemilczanej
      # warstwie `ui2/`), wiec tekst dostaje straznika zamiast kolejnej korekty.
      - name: Run CLAUDE.md structure guard
        run: python mv-design-pro/scripts/claude_md_struktura_guard.py
      # Program A/B (karta AB-1d_min): kazdy otwarty wiersz zamrozenia dynamiki ma
      # DOKLADNIE jeden kamien w kolumnie „Domyka" planu; zapadka zmierzona 2026-09-23
      # (lista znanych naruszen maleje razem z poprawkami planu).
      - name: Run program A/B freeze rows guard
        run: python mv-design-pro/scripts/program_ab_freeze_rows_guard.py
