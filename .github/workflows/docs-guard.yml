name: Docs Integrity Guard

on:
  pull_request:
  push:

jobs:
  docs-guard:
    name: Documentation integrity check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run docs guard
        run: python mv-design-pro/scripts/docs_guard.py
      # Opis struktury w CLAUDE.md i `.claude/rules/` musi zgadzac sie z repozytorium.
      # Ta sama klasa fikcji wyszla z CLAUDE.md trzy razy (nieistniejace testy
      # kontraktowe SLD, skasowany `designer/`, osiemnascie modulow widmo przy
      # przemilczanej warstwie `ui2/`), wiec tekst dostaje straznika zamiast kolejnej
      # korekty. Od 2026-11-11 drzewa `ui/`+`ui2/` i `backend/src` stoja w regulach
      # sciezkowych `.claude/rules/{frontend,backend}.md`; guard pilnuje tez mapy regul
      # w CLAUDE.md, wzorcow `paths` i tego, ze zadna regula nie jest ignorowana przez git.
      - name: Run CLAUDE.md structure guard
        run: python mv-design-pro/scripts/claude_md_struktura_guard.py
      # Plan A/B §13 (decyzja O-35, karta AB-1a Pakiet E1): wiazaca sekwencja przyrostow §5
      # sprawdzana wobec kolumny „Zaleznosc" §11 — przyrost przed zaleznoscia, cykl albo
      # przyrost bez miejsca w sekwencji = czerwony. Przeglad adwersarzowy znalazl cykl
      # AB-4 <-> AB-H2, ktorego nikt nie widzial, bo nic tego nie liczylo.
      - name: Run plan A/B dependency guard
        run: python mv-design-pro/scripts/plan_ab_zaleznosci_guard.py
