name: Frontend E2E full

# Karta E2E-MOCK-BEZ-CI / TESTY-DRYF-E2E (2026-08-12): pełna suita
# `npm run test:e2e` (90 plików e2e/*.spec.ts wg pomiaru 2026-09-09, wszystkie hitujące realny
# backend — `PLAYWRIGHT_REAL_BACKEND=1` wymuszony bezwarunkowo w
# `playwright-run.mjs`) nie miała ŻADNEGO workflow CI mimo unikalnego
# pokrycia (kreatory, SLD, zrzuty audytowe, motyw) niepokrytego przez
# `frontend-e2e-smoke.yml` (2 pliki krytyczne + KD-11). Ten workflow domyka
# tę lukę po naprawieniu dryfu do pełnej zielonej suity.

on:
  push:
    paths:
      - 'mv-design-pro/frontend/**'
      - 'mv-design-pro/backend/**'
      - '.github/workflows/frontend-e2e-full.yml'
  pull_request:
    paths:
      - 'mv-design-pro/frontend/**'
      - 'mv-design-pro/backend/**'
      - '.github/workflows/frontend-e2e-full.yml'

jobs:
  full-real-backend-e2e:
    runs-on: ubuntu-latest
    # Karta SZYBKIE-TESTY (2026-09-30): suita dzielona na 4 shardy, kazdy na wlasnym runnerze
    # z wlasnym backendem i baza (izolacja biegu w playwright.config.ts). Pliki speców
    # przydziela `scripts/e2e_shardy.py` algorytmem LPT wg czasow zmierzonych w
    # `frontend/e2e/czasy_specow.json` — wbudowane `--shard=k/n` dzieli po LICZBIE testow, a
    # czasy speców roznia sie o rzedy wielkosci (pomiar 2026-09-30, 511 przypadkow, 1 871 s
    # sumy: najwolniejszy shard wbudowanego podzialu ~714 s, LPT ~468 s). Przed zmiana: jeden
    # bieg 25 min na runnerze (przebieg 36706845707). Shardy sa rozlaczne i razem daja komplet
    # `e2e/*.spec.ts` (samotest `scripts/test_e2e_shardy.py`); spec bez pomiaru dostaje mediane.
    # `fail-fast: false` — czerwony shard nie ucina pozostalych, raport jest kompletny.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mv-design-pro/frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: '1.8.3'

      - name: Install frontend dependencies
        working-directory: mv-design-pro/frontend
        run: npm ci

      - name: Install backend and browser dependencies
        working-directory: mv-design-pro/frontend
        run: npm run test:e2e:setup:real

      # Shard pełnej suity — jedno wywołanie Playwrighta uruchamia backend + vite
      # RAZ (webServer) na shard, niezależnie od liczby plików speców. Lista plików z
      # `e2e_shardy.py` (kod != 0 przy pomiarze speku usuniętego przerywa krok).
      - name: Run full real-backend E2E suite (shard ${{ matrix.shard }}/4)
        working-directory: mv-design-pro/frontend
        run: |
          PLIKI="$(python ../scripts/e2e_shardy.py --shard ${{ matrix.shard }}/4)"
          npm run test:e2e -- $PLIKI
