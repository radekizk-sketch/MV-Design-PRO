name: P0 Extended Guards (V12K invariants)

# GAP-1 zaadresowany per test architect audit (background agent):
# 48 z 67 guardów nie było w CI. Ten workflow uruchamia top 12 brakujących
# guardów po P0 sprint, egzekwujących V12.xx invariants (NO_HEURISTICS,
# overlay no_physics, solver_boundary, port_binding strict, etc.).
#
# Aktywne na push + PR (każda zmiana kodu = enforcement).
#
# Reference:
# - Test architect audyt 2026-05-14 (background agent)
# - CLAUDE.md § Core Rules: NO HEURISTICS, WHITE BOX, Determinism, etc.
# - mv-design-pro/scripts/ (67 guard scripts total)

on:
  pull_request:
  push:

jobs:
  p0-extended-guards:
    name: V12K Extended Invariant Guards
    runs-on: ubuntu-latest
    timeout-minutes: 8

    defaults:
      run:
        working-directory: mv-design-pro

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Guardy delta-owe (solver_boundary, resultset_v1_schema) porownuja
          # zmiany wobec galezi bazowej. Klon glebokosci 1 nie ma ani
          # `origin/main`, ani `HEAD~1` — przy fetch-depth domyslnym oba guardy
          # padaly, a workflow przerywal sie na 3. z 15 krokow, wiec 12 kolejnych
          # guardow NIGDY sie nie wykonywalo (naprawa 2026-07-25).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # === Physics / Solver boundary guards (V12K rule §9) ===
      # CLAUDE.md § Core Rules: solvers MUST NOT contain heuristics
      - name: Load Flow — no heuristics
        run: python scripts/load_flow_no_heuristics_guard.py

      - name: Protection — no heuristics
        run: python scripts/protection_no_heuristics_guard.py

      - name: Solver boundary (frozen API)
        run: python scripts/solver_boundary_guard.py

      - name: Overlay — no physics (presentation layer)
        run: python scripts/overlay_no_physics_guard.py

      # === Determinism / trace guards ===
      # CLAUDE.md § Core Rules: Same input MUST produce identical output
      # 2026-07-17: warn-only ZDJĘTE — wszystkie guardy tego workflowu zielone
      # na czystym HEAD (weryfikacja lokalna przy przenosinach z martwego
      # katalogu mv-design-pro/.github/workflows); trace_determinism wymaga
      # wyłącznie pydantic (import modeli domeny, bez cięższych zależności).
      - name: Zależności trace guard (pydantic)
        run: pip install pydantic

      # Karta N-D5-FUSE: bezpiecznik topikowy nie moze byc liczony wzorem IDMT
      # przekaznika (IEC 60255) — jego pasmo (IEC 60282-1) pochodzi z karty
      # katalogowej producenta. Guard sprawdza tekst, strukture I ZACHOWANIE
      # (przepuszcza bezpiecznik przez analizator), wiec IMPORTUJE warstwe
      # domeny. Stoi PO instalacji pydantic, bo `domain/__init__.py` ciagnie
      # `result_set` -> `pydantic` — sprawdzone uruchomieniem na golym
      # interpreterze, nie zalozone (pierwotnie wpiety przed tym krokiem,
      # padal na ModuleNotFoundError).
      - name: Protection — bezpiecznik nie liczony jak przekaznik
        run: python scripts/protection_fuse_band_guard.py

      - name: Trace determinism
        run: python scripts/trace_determinism_guard.py

      - name: Fault scenarios determinism
        run: python scripts/fault_scenarios_determinism_guard.py

      # === UI / terminology guards (V12K polski UI 100%) ===
      - name: UI terminology
        run: python scripts/ui_terminology_guard.py

      - name: Forbidden UI terms
        run: python scripts/forbidden_ui_terms_guard.py

      - name: UTF-8 mojibake (UI/docs encoding)
        run: python scripts/utf8_mojibake_guard.py

      # === V12.xx canon guards ===
      - name: V12.xx canon (hierarchy + paths)
        run: python scripts/v12xx_canon_guard.py

      - name: Severity contract
        run: python scripts/severity_contract_guard.py

      - name: Result Set v1 schema
        run: python scripts/resultset_v1_schema_guard.py

      # === Port binding (P0.3 F2 foundation) ===
      # Strict mode: zero tolerance for missing endpoint ports per port_binding_guard.py
      # Currently 0 violations (100% sync ports.json ↔ SVGs in P0.1).
      - name: Port binding (STRICT mode — ports.json schema)
        run: python scripts/port_binding_guard.py --strict

      # =====================================================================
      # V12K-263 — DOMKNIECIE LUKI „guard istnieje, ale nikt go nie uruchamia"
      # =====================================================================
      # POMIAR (2026-07-28): 75 guardow w `scripts/`, 35 wolanych w workflowach,
      # 40 poza CI — z tego 29 ZIELONYCH na HEAD. Guard, ktory nigdy sie nie
      # wykonuje, jest gorszy niz jego brak: daje pozor ochrony inwariantu, ktory
      # w rzeczywistosci nie jest egzekwowany. Ten sam wniosek powolal ten workflow
      # (audyt 2026-05-14) — luka po prostu odrosla.
      #
      # Ponizej 30 guardow spoza CI, zielonych na HEAD (w tym dwa NAPRAWIONE w tej
      # karcie: `guard_ux_flow_v1` — trzecia kopia zakazu PCC stosowana do calego
      # repo; `nn_source_menu_guard` — sprawdzal NAZWY plikow dostawcy zamiast
      # zdolnosci). Laczny czas: ~12 s.
      #
      # `guard_diff_base.py` NIE jest tu wpiety — to wspolna BIBLIOTEKA guardow
      # delta-owych, a nie guard; „przechodzil" tylko dlatego, ze uruchomiony
      # samodzielnie nic nie robi.
      #
      # Siedem guardow scizki renderu SLD v2 ZOSTALO WYGASZONYCH (nie wyciszonych) —
      # ich przedmiot usunal commit e231a068. Uzasadnienie i nastepcy w v3:
      # `docs/v12xx/REJESTR_KONFLIKTOW.md`, wpis V12K-263.

      # === Kontrakty API i operacji domenowych ===
      - name: API lifecycle (macierz endpointow)
        run: python scripts/api_lifecycle_guard.py

      - name: Domain ops — jeden kanoniczny klient HTTP
        run: python scripts/domain_ops_unified_guard.py

      - name: Single entry point (CanonicalOpName)
        run: python scripts/single_entry_point_guard.py

      - name: Legacy public path
        run: python scripts/legacy_public_path_guard.py

      - name: Reference networks
        run: python scripts/reference_networks_guard.py

      # === Warstwy: zero fizyki i zero sladu w prezentacji ===
      - name: UI — no physics (warstwa prezentacji)
        run: python scripts/ui_no_physics_guard.py

      - name: Trace v2 — brak wycieku do UI
        run: python scripts/trace_ui_leak_guard.py

      - name: Brak bezposrednich parametrow zwarcia
        run: python scripts/no_direct_fault_params_guard.py

      - name: Brak podstawiania liczb za nieobecne dane wejsciowe solvera
        run: python scripts/solver_input_substitute_guard.py

      - name: Solver diff (hasze referencyjne solwerow)
        run: python scripts/solver_diff_guard.py

      # === UX: zywe akcje, uczciwe stany zerowe, jezyk ===
      - name: Dead click (akcje bez obslugi)
        run: python scripts/dead_click_guard.py

      - name: Empty state CTA (stan zerowy z nastepnym krokiem)
        run: python scripts/empty_state_cta_guard.py

      - name: Tooltip coverage
        run: python scripts/tooltip_coverage_guard.py

      - name: Interaction matrix
        run: python scripts/interaction_matrix_guard.py

      - name: Brak surowych identyfikatorow w UI
        run: python scripts/no_raw_ids_in_ui_guard.py

      - name: Falszywe zero (brak danej pokazany jako 0,00)
        run: python scripts/false_zero_guard.py --strict

      - name: Jezyk backendu (zakazane terminy angielskie)
        run: python scripts/language_guard.py

      - name: Raport — flow roboczy, checklista, eksporty
        run: python scripts/report_export_guard.py

      - name: Menu zrodel nN (zdolnosci, nie nazwy plikow)
        run: python scripts/nn_source_menu_guard.py

      - name: Potwierdzenie sukcesu operacji kanonicznych
        run: python scripts/success_toast_guard.py

      # === SLD: struktura i zakres identyfikatorow warstw ===
      - name: SLD — zakres SldLayerId (tylko renderer)
        run: python scripts/sld_layer_id_scope_guard.py

      - name: SLD — brak zewnetrznego mostu WE/WY
        run: python scripts/sld_no_external_we_wy_bridge_guard.py

      - name: SLD — stacja nie jest prostokatem
        run: python scripts/station_not_rectangle_guard.py

      - name: SLD — GPZ deklaruje strukture przemyslowa
        run: python scripts/gpz_switchgear_guard.py

      - name: SLD — kontrakt przylaczenia DER
        run: python scripts/der_pcc_guard.py

      # === Spojnosc UX Flow V1 + repozytorium ===
      - name: UX Flow V1 (spojnosc dokumentu, testow i inwariantow)
        run: python scripts/guard_ux_flow_v1.py

      - name: Graf importow
        run: python scripts/import_graph_guard.py

      - name: Grep-zero (wzorce zakazane)
        run: python scripts/grep_zero_guard.py

      - name: Archiwum dokumentacji
        run: python scripts/docs_archive_guard.py

      - name: Spojnosc licznikow w dokumentacji
        run: python scripts/docs_count_consistency_guard.py

      # `vulture_guard` zwraca 2, gdy nie ma ani pakietu `vulture`, ani `poetry`
      # (runner tego workflowu nie instaluje zaleznosci backendu). Bez tego kroku
      # wpielibysmy guarda, ktory w CI zawsze pada — czyli dokladnie ten defekt,
      # ktory ta zmiana usuwa.
      - name: Zaleznosc vulture
        run: pip install vulture

      - name: Martwy kod backendu (vulture)
        run: python scripts/vulture_guard.py

      # =====================================================================
      # KARTA ROUTERY-MARTWE — luka „guard istnieje, ale nikt go nie uruchamia"
      # ODROSLA PO RAZ TRZECI (pomiar 2026-08-08).
      # =====================================================================
      # `guardy_z_ci.py` czyta liste guardow WPROST z tych workflowow, wiec guard
      # niewpiety tutaj nie jest uruchamiany ani w CI, ani przez bramke odbioru
      # nadzorcy. Na HEAD dwa guardy stały poza CI mimo zieleni:
      #
      #   * `route_prefix_guard` — kanon prefiksu tras + rejestr martwych klientow
      #     frontu (16 sciezek w 4 modulach). Guard z ZAPADKA, ktorej nikt nie
      #     zdejmowal, bo nikt jej nie uruchamial.
      #   * `export_codenames_guard` — zakaz kryptonimow projektu w eksportach.
      #
      # Trzeci krok to nowy guard tej karty: `api_lifecycle_guard` i
      # `route_prefix_guard` chodza po trasach WPIETYCH, wiec router zdefiniowany
      # i nigdy niezamontowany byl dla nich niewidzialny Z KONSTRUKCJI (iniekcja
      # pustego routera przechodzila komplet 69 guardow z RC=0).
      - name: Kanon prefiksu tras (backend / front / proxy)
        run: python scripts/route_prefix_guard.py

      - name: Kryptonimy projektu w eksportach
        run: python scripts/export_codenames_guard.py

      - name: Montaz routerow (router zdefiniowany = router wpiety)
        run: python scripts/router_mount_guard.py

      # =====================================================================
      # KARTA SUITA-BEZ-WYWOLANIA (2026-08-12) — dlug nazwany w REJESTR_KONFLIKTOW.md
      # V12K-276(e): `scripts/verify_v12_5.py`/`verify_v12_5_1.py`/`verify_v12_6.py`
      # (agregatory 655/655/254 linii) nigdy nie stały w ŻADNYM workflow CI, a
      # dodatkowo wskazywały pliki, których nie było (6/6 golden testów frontu,
      # 11/23 sciezek trybu --quick, 5/17 guardow SLD wolanych przez verify_v12_6,
      # 1 plik UI V126AcademicSurface.tsx). Oba agregatory SKASOWANE. Dwa realne
      # kroki, ktore wolały wylacznie przez nie, wpiete tutaj bezposrednio; trzeci
      # to zapadka na powrot tej samej klasy defektu.
      # =====================================================================
      - name: SLD — GPZ 110 kV -> TR -> SN bez pominiecia rozdzielni
        run: python scripts/no_direct_110kv_tr_tie_without_switchgear.py

      - name: Kontrakt tekstowy V12.6 (kanon akademicki NC RfG/PTPiREE)
        run: python scripts/v126_contract_text_guard.py

      - name: Zapadka — suita weryfikacyjna wskazujaca pliki, ktorych nie ma
        run: python scripts/verification_phantom_paths_guard.py
