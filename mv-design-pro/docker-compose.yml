version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mv-design-pro-backend
    ports:
      - "18000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://mvdesign:mvdesign_secret@postgres:5432/mvdesign_db
      - SECRET_KEY=your-secret-key-change-in-production
      - DEBUG=true
      # Polityka wątków BLAS z pomiaru PERF-DYN-0 (uzasadnienie: backend/Dockerfile).
      - OPENBLAS_NUM_THREADS=1
      - OMP_NUM_THREADS=1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - mv-design-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mv-design-pro-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend:8000
      - VITE_API_URL_DEV=http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - mv-design-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: mv-design-pro-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=mvdesign
      - POSTGRES_PASSWORD=mvdesign_secret
      - POSTGRES_DB=mvdesign_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mv-design-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mvdesign -d mvdesign_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  mv-design-network:
    driver: bridge
