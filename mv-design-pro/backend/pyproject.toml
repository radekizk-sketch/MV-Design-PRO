[tool.poetry]
name = "mv-design-pro-backend"
version = "0.1.0"
description = "MV-DESIGN PRO - Professional Medium Voltage Network Design System"
authors = ["MV-Design Team"]
readme = "README.md"
packages = [
    {include = "api", from = "src"},
    {include = "application", from = "src"},
    {include = "analysis", from = "src"},
    {include = "catalog", from = "src"},
    {include = "diagnostics", from = "src"},
    {include = "domain", from = "src"},
    {include = "dziedziny", from = "src"},
    {include = "enm", from = "src"},
    {include = "infrastructure", from = "src"},
    {include = "network_model", from = "src"},
    {include = "protection", from = "src"},
    {include = "reference_engine", from = "src"},
    {include = "solver_input", from = "src"},
    {include = "solvers", from = "src"},
    {include = "werdykt", from = "src"},
    {include = "whitebox", from = "src"},
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
numpy = "^1.26.0"
scipy = "^1.12.0"
networkx = "^3.2.1"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
asyncpg = "^0.29.0"
psycopg = {extras = ["binary"], version = "^3.1.18"}
motor = "^3.3.2"
redis = "^5.0.1"
python-multipart = "^0.0.6"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
httpx = "^0.26.0"
celery = "^5.3.6"
pandas = "^2.1.4"
# Odczyt arkuszy XLSX (import sieci z arkusza operatora). Zaleznosc GLOWNA, nie dev:
# koncowka `POST /api/import/xlsx` czyta plik uzytkownika przez openpyxl na produkcji.
# Do 2026-08-07 biblioteki NIE BYLO w zaleznosciach — koncowka zwracala 422
# „Brak biblioteki openpyxl" dla KAZDEGO wejscia, a testy tego nie wykrywaly, bo
# chodzily obok realnej sciezki (`import_from_dict`).
openpyxl = "^3.1.5"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-asyncio = "^0.23.3"
pytest-cov = "^4.1.0"
sqlalchemy = "^2.0.25"
black = "^24.1.0"
ruff = "^0.1.13"
mypy = "^1.8.0"
pre-commit = "^3.6.0"
reportlab = "^4.0"
python-docx = "^1.2.0"
# Ekstrakcja tekstu z wygenerowanego PDF w testach WHITE BOX (test_export_reports.py
# test_white_box_contains_latex_trace) - jedyny sposob zweryfikowania, ze slad LaTeX
# faktycznie znajduje sie w renderowanym dokumencie, a nie tylko w kodzie generujacym.
# Dry-run pip (karta SKIP-INWENTARZ, 2026-09-05): pymupdf 1.28.2 rozwiazuje sie BEZ
# zadnych zaleznosci przechodnich - zero ryzyka dla pinow numpy/scipy/pandas/networkx.
pymupdf = "^1.28"
vulture = "^2.16"
# Stuby PyYAML: `catalog/profiles/nc_rfg/loader.py` czyta profile NC RfG z YAML-a, a bez
# stubow mypy raportowal `import-untyped` (dlug typow, nie brak zaleznosci runtime —
# `pyyaml` jest w zaleznosciach glownych). Doinstalowanie stubow to naprawa u zrodla,
# w odroznieniu od wyciszenia importu.
types-PyYAML = "^6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501", "B904", "N806", "N815", "N817", "N818"]
target-version = "py311"

[tool.ruff.per-file-ignores]
"src/api/*.py" = ["B008"]
"tests/**/*.py" = ["E402", "N801", "N802", "B017"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
# MYPY-PUSTA-BRAMKA (2026-09-23): ROZWIAZYWANIE MODULOW WLASNYCH. Kod importuje
# pakiety z `src/` jako moduly najwyzszego poziomu (`from werdykt.kontrakt import
# ...`), a `src/__init__.py` robi z `src` pakiet. Bez dwoch ponizszych kluczy
# `mypy src` nadawal plikom nazwy `src.werdykt.kontrakt`, import `werdykt.kontrakt`
# nie trafial w zaden plik, a globalne `ignore_missing_imports = true` zamienialo
# go po cichu w `Any` — typy MIEDZY modulami nie byly sprawdzane wcale (sonda:
# funkcja `-> int` zwracajaca model pydantic z innego modulu = „Success").
#   * `mypy_path` = `src` (wzgledem TEGO pliku, nie katalogu biezacego),
#   * `explicit_package_bases` = nazwa modulu liczona od `src`, wiec plik
#     sprawdzany i plik importowany to TEN SAM modul (bez tego mypy przerywa:
#     „Source file found twice under different module names").
# Lista sprawdzanych plikow bez zmian (`mypy src` = wszystkie pliki `src/**/*.py`).
# Pomiar i plan zejscia: `scripts/mypy_ratchet_pomiar_2026-09-23.md`.
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
explicit_package_bases = true
# warn_return_any wyłączone — Pydantic .model_dump() / canonicalize_json /
# FastAPI handlers zwracają Any-typed dynamic JSON. Wymuszenie cast() przy
# każdym takim wywołaniu = noise without value (340 błędów w API layer).
# Logika domeny ma w pełni typed signatures (disallow_untyped_defs ON).
warn_return_any = false

# Biblioteki ZEWNETRZNE bez stubow i bez znacznika py.typed (K30-14 NO-GO #10:
# dawniej wyciszane GLOBALNYM `ignore_missing_imports = true`). Wyciszenie jest
# teraz IMIENNE: globalne chowalo tez nierozwiazany import WLASNEGO modulu, czyli
# dokladnie mechanizm pustej bramki. Nowa biblioteka bez stubow zapala zapadke
# (`import-untyped` / `import-not-found`) — decyzja: doinstaluj stuby `types-*`
# albo dopisz ja tutaj. Lista = zmierzony zbior importow bez typow (2026-09-23);
# `boto3` i `google.cloud` sa opcjonalne (import leniwy w `cloud_backup.py`).
[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "celery.*",
    "google.cloud.*",
    "networkx.*",
    "openpyxl.*",
    "reportlab.*",
    "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# CIENIOWANIE PAKIETOW ZRODLOWYCH PRZEZ TESTOWE (KD-9, dlug z KD-6).
# Domyslny tryb `prepend` wstrzykuje katalog bazowy KAZDEGO modulu testowego na
# poczatek `sys.path` i nadaje modulom nazwy wyprowadzone z pakietu testowego.
# Skutek zmierzony na HEAD: bieg CZESCIOWY
# `pytest tests/analysis tests/application/analyses` dawal 108 FANTOMOWYCH
# porazek (`ModuleNotFoundError: No module named 'reference_engine.validation'`),
# bo katalog `tests/` trafial na sciezke przed `src/`, a `tests/reference_engine/`
# przeslanial pakiet zrodlowy `src/reference_engine/`. Pelny bieg byl zielony,
# wiec CI tego nie widzialo — kazdy bieg czesciowy dawal falszywy obraz.
# `importlib` nadaje modulom testowym nazwy wyprowadzone z PELNEJ sciezki wzgledem
# rootdir (`tests.analysis.test_x`) i NIE modyfikuje `sys.path`, wiec przestrzen
# importu zrodel jest odizolowana od ukladu katalogow testowych. Korzen backendu
# dokladamy jawnie w `tests/conftest.py` (import `tests.*` musi dzialac).
#
# UWAGA: tryb importu NIE ma wlasnego klucza ini — pytest wystawia go wylacznie
# jako opcje wiersza polecen `--import-mode` (dest=importmode). Klucz
# `importmode = "importlib"` w tej sekcji jest CICHO IGNOROWANY (pytest zglasza
# tylko `PytestConfigWarning: Unknown config option`), dlatego wchodzi przez
# `addopts` — inaczej caly ten zapis bylby dekoracja bez skutku.
addopts = "--import-mode=importlib"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: tests requiring database/persistence (P13b governance)",
    "determinism: tests verifying deterministic output (same input = same output)",
    "pandapower: walidacja krzyzowa z pandapower - wymaga izolowanego srodowiska z scipy<1.17",
    "andes: wyrocznia zewnetrzna dynamiki ANDES - wymaga izolowanego srodowiska, ANDES nie wchodzi do zaleznosci produkcyjnych (karta W6-2)",
]
