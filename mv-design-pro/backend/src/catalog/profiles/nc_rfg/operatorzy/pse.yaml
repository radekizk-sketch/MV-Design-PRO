# Warstwa operatora (OSP) — tożsamość operatora, dokument ruchowy i nadpisania.
#
# Dokument operatora (instrukcja ruchu) nie jest przechowywany w repozytorium, więc jego
# wydanie jest nieustalone (OD-21). Nadpisanie jest dopuszczalne wyłącznie wtedy, gdy
# wartość operatora różni się od warstwy niższej — pozostałe parametry profil efektywny
# bierze z WOS albo z wartości zastanych, z ich własnym stanem źródła. Grupa nadpisania może
# nieść proweniencję (`jednostka_redakcyjna`, `status`, `uwagi_pl`) obok wartości.
#
# `bank_nastaw` (plan AB §2.2 O-17): nastawy zabezpieczeń modułów wymagane przez operatora —
# słownik zamknięty pozycji (`u_min_pu`, `u_min_czas_s`, `u_max_pu`, `u_max_czas_s`, `f_min_hz`,
# `f_min_czas_s`, `f_max_hz`, `f_max_czas_s`, `rocof_hz_s`, `rocof_czas_s`,
# `przesuniecie_fazy_deg`); pozycja = `id`, `nazwa_pl`, `wartosc`, `jednostka`,
# `jednostka_redakcyjna` dokumentu operatora. Wartość bez wskazanej podstawy jest odrzucana —
# brak danych jest stanem (NIEUSTALONE), nigdy zerem ani wartością „typową".
#
# `wykonanie_prawa` (plan AB §2.3 O-31): czy operator skorzystał z prawa określenia wymagań,
# dla których rozporządzenie mu je przyznaje (`prawo_operatora` w `nc_rfg.yaml`); wpis
# `<id wymagania>: {skorzystal: true|false, jednostka_redakcyjna: "..."}`. Pusty słownik =
# nieustalone dla każdego takiego wymagania.
warstwa: OSD
