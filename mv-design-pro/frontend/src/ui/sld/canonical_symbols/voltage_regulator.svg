<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Voltage regulator / Regulator napięcia (Auto Voltage Regulator AVR / Line VR) — IEC 60617 -->
  <!-- Inline single-phase voltage regulator: variable transformer with adjustment arrow. -->
  <!-- Top connection (input voltage) -->
  <line x1="50" y1="0" x2="50" y2="20" stroke="currentColor" stroke-width="3"/>
  <!-- Coil body (oval representing autotransformer-style regulator) -->
  <rect x="32" y="20" width="36" height="48" rx="18" fill="none" stroke="currentColor" stroke-width="3"/>
  <!-- Diagonal arrow indicating variable / tap-changer (continuous control) -->
  <line x1="22" y1="64" x2="78" y2="24" stroke="currentColor" stroke-width="2"/>
  <polyline points="74,22 78,24 76,28" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- "VR" label -->
  <text x="50" y="50" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="currentColor">VR</text>
  <!-- Bottom connection (regulated output) -->
  <line x1="50" y1="68" x2="50" y2="100" stroke="currentColor" stroke-width="3"/>
  <!-- Ports: top (50, 0) input, bottom (50, 100) regulated output -->
</svg>
