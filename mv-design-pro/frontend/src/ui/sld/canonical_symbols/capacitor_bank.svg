<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Capacitor bank (3-phase shunt VAR compensation) / Bateria kondensatorów — IEC 60617 -->
  <!-- Three single-phase capacitors in delta/wye configuration. -->
  <!-- Top connection (3-phase bus) -->
  <line x1="50" y1="5" x2="50" y2="20" stroke="currentColor" stroke-width="3"/>
  <!-- Horizontal connection bar (3 phases) -->
  <line x1="20" y1="20" x2="80" y2="20" stroke="currentColor" stroke-width="3"/>
  <!-- Phase A capacitor (left) -->
  <line x1="25" y1="20" x2="25" y2="38" stroke="currentColor" stroke-width="2"/>
  <line x1="18" y1="38" x2="32" y2="38" stroke="currentColor" stroke-width="3"/>
  <line x1="18" y1="44" x2="32" y2="44" stroke="currentColor" stroke-width="3"/>
  <line x1="25" y1="44" x2="25" y2="62" stroke="currentColor" stroke-width="2"/>
  <!-- Phase B capacitor (center) -->
  <line x1="50" y1="20" x2="50" y2="38" stroke="currentColor" stroke-width="2"/>
  <line x1="43" y1="38" x2="57" y2="38" stroke="currentColor" stroke-width="3"/>
  <line x1="43" y1="44" x2="57" y2="44" stroke="currentColor" stroke-width="3"/>
  <line x1="50" y1="44" x2="50" y2="62" stroke="currentColor" stroke-width="2"/>
  <!-- Phase C capacitor (right) -->
  <line x1="75" y1="20" x2="75" y2="38" stroke="currentColor" stroke-width="2"/>
  <line x1="68" y1="38" x2="82" y2="38" stroke="currentColor" stroke-width="3"/>
  <line x1="68" y1="44" x2="82" y2="44" stroke="currentColor" stroke-width="3"/>
  <line x1="75" y1="44" x2="75" y2="62" stroke="currentColor" stroke-width="2"/>
  <!-- Wye point connection bar -->
  <line x1="25" y1="62" x2="75" y2="62" stroke="currentColor" stroke-width="3"/>
  <!-- Wye to earth or neutral -->
  <line x1="50" y1="62" x2="50" y2="75" stroke="currentColor" stroke-width="2"/>
  <!-- Earth symbol -->
  <line x1="40" y1="75" x2="60" y2="75" stroke="currentColor" stroke-width="3"/>
  <line x1="44" y1="80" x2="56" y2="80" stroke="currentColor" stroke-width="2"/>
  <line x1="48" y1="85" x2="52" y2="85" stroke="currentColor" stroke-width="2"/>
  <!-- Label C -->
  <text x="82" y="95" font-family="sans-serif" font-size="8" font-weight="bold" fill="currentColor">C</text>
  <!-- Ports: top (50, 0) — 3-phase bus connection -->
</svg>
