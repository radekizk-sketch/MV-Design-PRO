<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Power meter (P+jQ) / Licznik energii czynnej i biernej — IEC 60617 + ANSI -->
  <!-- Standard rectangle with "P,Q" or "kWh / kvarh" label representing 4-quadrant meter -->
  <!-- Meter body -->
  <rect x="25" y="30" width="50" height="40" fill="none" stroke="currentColor" stroke-width="3"/>
  <!-- Display divider -->
  <line x1="25" y1="50" x2="75" y2="50" stroke="currentColor" stroke-width="2"/>
  <!-- Upper display: kWh -->
  <text x="50" y="46" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="middle" fill="currentColor">kWh</text>
  <!-- Lower display: kvarh -->
  <text x="50" y="64" font-family="sans-serif" font-size="7" text-anchor="middle" fill="currentColor">kvarh</text>
  <!-- Connection stubs (4 wires for 3F4W metering) -->
  <line x1="50" y1="0" x2="50" y2="30" stroke="currentColor" stroke-width="2"/>
  <line x1="50" y1="70" x2="50" y2="100" stroke="currentColor" stroke-width="2"/>
  <!-- Ports: top (50, 0) line side, bottom (50, 100) load side -->
</svg>
