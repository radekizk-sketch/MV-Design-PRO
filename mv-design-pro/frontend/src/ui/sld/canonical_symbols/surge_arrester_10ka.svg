<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Surge arrester 10 kA / Ogranicznik przepięć 10 kA — IEC 60617 -->
  <!-- Standard surge arrester with explicit current rating annotation. -->
  <!-- Top connection -->
  <line x1="50" y1="5" x2="50" y2="25" stroke="currentColor" stroke-width="3"/>
  <!-- Arrester body (rectangle with internal element) -->
  <rect x="38" y="25" width="24" height="50" fill="none" stroke="currentColor" stroke-width="3"/>
  <!-- Internal MOV element indicator -->
  <line x1="42" y1="35" x2="58" y2="35" stroke="currentColor" stroke-width="1.5"/>
  <line x1="42" y1="50" x2="58" y2="50" stroke="currentColor" stroke-width="1.5"/>
  <line x1="42" y1="65" x2="58" y2="65" stroke="currentColor" stroke-width="1.5"/>
  <!-- Rating annotation -->
  <text x="68" y="42" font-family="sans-serif" font-size="7" fill="currentColor">10kA</text>
  <text x="68" y="52" font-family="sans-serif" font-size="7" fill="currentColor">In</text>
  <!-- Connection to earth -->
  <line x1="50" y1="75" x2="50" y2="85" stroke="currentColor" stroke-width="3"/>
  <!-- Earth symbol -->
  <line x1="42" y1="85" x2="58" y2="85" stroke="currentColor" stroke-width="3"/>
  <line x1="45" y1="90" x2="55" y2="90" stroke="currentColor" stroke-width="2"/>
  <line x1="48" y1="95" x2="52" y2="95" stroke="currentColor" stroke-width="2"/>
  <!-- Ports: top: (50, 0) phase connection -->
</svg>
