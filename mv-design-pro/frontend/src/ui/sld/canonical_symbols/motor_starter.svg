<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Motor starter / Rozrusznik silnika — IEC 60617 + ANSI 49M -->
  <!-- Motor protection relay + contactor combination, marker "M" inside circle. -->
  <!-- Top connection (supply) -->
  <line x1="50" y1="0" x2="50" y2="22" stroke="currentColor" stroke-width="3"/>
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="currentColor" stroke-width="3"/>
  <!-- "M" letter inside -->
  <text x="50" y="58" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="currentColor">M</text>
  <!-- Auxiliary contact marker (small line, contactor symbol on right) -->
  <line x1="74" y1="36" x2="82" y2="36" stroke="currentColor" stroke-width="2"/>
  <line x1="82" y1="32" x2="82" y2="40" stroke="currentColor" stroke-width="2"/>
  <!-- Bottom connection (to motor) -->
  <line x1="50" y1="78" x2="50" y2="100" stroke="currentColor" stroke-width="3"/>
  <!-- Ports: top (50, 0) supply side, bottom (50, 100) motor side -->
</svg>
