<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Drawout circuit breaker / Wyłącznik wyciągalny - IEC 60617-4-30 -->
  <!-- Circuit breaker housed in withdrawable carriage (rack-mounted compartment). -->
  <!-- Withdrawable compartment frame (outer) -->
  <rect x="18" y="22" width="64" height="56" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4,2"/>
  <!-- Circuit breaker body (inner) -->
  <rect x="30" y="34" width="40" height="32" fill="none" stroke="currentColor" stroke-width="3"/>
  <!-- Breaker contact markers (open-state X) -->
  <line x1="35" y1="38" x2="65" y2="62" stroke="currentColor" stroke-width="2"/>
  <line x1="65" y1="38" x2="35" y2="62" stroke="currentColor" stroke-width="2"/>
  <!-- Drawout racking position indicators (3 vertical lines on left of compartment) -->
  <line x1="14" y1="42" x2="14" y2="58" stroke="currentColor" stroke-width="1.5"/>
  <line x1="11" y1="42" x2="11" y2="58" stroke="currentColor" stroke-width="1.5"/>
  <line x1="8" y1="42" x2="8" y2="58" stroke="currentColor" stroke-width="1.5"/>
  <!-- Connection stubs -->
  <line x1="50" y1="0" x2="50" y2="34" stroke="currentColor" stroke-width="3"/>
  <line x1="50" y1="66" x2="50" y2="100" stroke="currentColor" stroke-width="3"/>
  <!-- Ports:
       top: (50, 0), bottom: (50, 100) -->
</svg>
