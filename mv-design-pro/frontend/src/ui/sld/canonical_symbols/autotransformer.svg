<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Autotransformer / Autotransformator — IEC 60617 -->
  <!-- Single coil (one winding) with intermediate tap. Both circles share electrical path. -->
  <!-- Top connection -->
  <line x1="50" y1="5" x2="50" y2="20" stroke="currentColor" stroke-width="3"/>
  <!-- Single shared coil (one circle representing autotransformer principle) -->
  <circle cx="50" cy="50" r="22" fill="none" stroke="currentColor" stroke-width="3"/>
  <!-- Intermediate tap on side -->
  <line x1="72" y1="50" x2="90" y2="50" stroke="currentColor" stroke-width="3"/>
  <circle cx="72" cy="50" r="2" fill="currentColor"/>
  <!-- Bottom connection -->
  <line x1="50" y1="72" x2="50" y2="95" stroke="currentColor" stroke-width="3"/>
  <!-- "AUTO" label -->
  <text x="42" y="52" font-family="sans-serif" font-size="6" fill="currentColor">AUTO</text>
  <!-- Ports: top (50,0), bottom (50,100), tap (95, 50) -->
</svg>
