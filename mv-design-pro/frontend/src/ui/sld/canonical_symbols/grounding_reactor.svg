<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Grounding reactor (Petersen coil) / Dławik uziemiający (cewka Petersena) — IEC 60617 -->
  <!-- Inductor coil connecting neutral to earth. Used in compensated MV networks. -->
  <!-- Top connection (to neutral) -->
  <line x1="50" y1="5" x2="50" y2="25" stroke="currentColor" stroke-width="3"/>
  <!-- Reactor coil (3 arcs as standard IEC inductor) -->
  <path d="M 50 25 Q 60 30 50 35 Q 60 40 50 45 Q 60 50 50 55 Q 60 60 50 65" fill="none" stroke="currentColor" stroke-width="3"/>
  <!-- Iron core (two vertical lines on left) -->
  <line x1="38" y1="25" x2="38" y2="65" stroke="currentColor" stroke-width="2"/>
  <line x1="41" y1="25" x2="41" y2="65" stroke="currentColor" stroke-width="2"/>
  <!-- Connection to earth -->
  <line x1="50" y1="65" x2="50" y2="78" stroke="currentColor" stroke-width="3"/>
  <!-- Earth symbol -->
  <line x1="40" y1="78" x2="60" y2="78" stroke="currentColor" stroke-width="3"/>
  <line x1="44" y1="84" x2="56" y2="84" stroke="currentColor" stroke-width="2"/>
  <line x1="48" y1="90" x2="52" y2="90" stroke="currentColor" stroke-width="2"/>
  <!-- Label L -->
  <text x="68" y="48" font-family="sans-serif" font-size="10" font-weight="bold" fill="currentColor">L</text>
  <!-- Ports: top: (50, 0) neutral connection -->
</svg>
