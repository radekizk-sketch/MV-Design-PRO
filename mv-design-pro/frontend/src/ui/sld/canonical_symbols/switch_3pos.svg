<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 3-position switch / Łącznik 3-pozycyjny (ON / OFF / EARTH) — IEC 60617 -->
  <!-- Standard for SF6 GIS modules: combines disconnector + earthing in one apparatus. -->
  <!-- Top contact -->
  <line x1="50" y1="0" x2="50" y2="30" stroke="currentColor" stroke-width="3"/>
  <circle cx="50" cy="30" r="2" fill="currentColor"/>
  <!-- Switch blade (OFF position shown — middle) -->
  <line x1="50" y1="30" x2="68" y2="50" stroke="currentColor" stroke-width="3"/>
  <!-- Bottom contact (ON position, port to circuit) -->
  <line x1="50" y1="70" x2="50" y2="100" stroke="currentColor" stroke-width="3"/>
  <circle cx="50" cy="70" r="2" fill="currentColor"/>
  <!-- Right contact (OFF — isolated) — dashed -->
  <line x1="68" y1="50" x2="80" y2="50" stroke="currentColor" stroke-width="2" stroke-dasharray="3,2"/>
  <!-- Earth symbol on right (EARTH position) -->
  <line x1="80" y1="50" x2="85" y2="50" stroke="currentColor" stroke-width="2"/>
  <line x1="82" y1="46" x2="88" y2="46" stroke="currentColor" stroke-width="2"/>
  <line x1="83" y1="50" x2="87" y2="50" stroke="currentColor" stroke-width="2"/>
  <line x1="84" y1="54" x2="86" y2="54" stroke="currentColor" stroke-width="2"/>
  <!-- Labels -->
  <text x="18" y="32" font-family="sans-serif" font-size="6" fill="currentColor">ON</text>
  <text x="18" y="73" font-family="sans-serif" font-size="6" fill="currentColor">CKT</text>
  <text x="74" y="42" font-family="sans-serif" font-size="6" fill="currentColor">OFF</text>
  <text x="80" y="62" font-family="sans-serif" font-size="6" fill="currentColor">E</text>
  <!-- Ports:
       top: (50, 0) — supply side
       bottom: (50, 100) — circuit side
       earth: (87, 50) — earth side (selectable) -->
</svg>
