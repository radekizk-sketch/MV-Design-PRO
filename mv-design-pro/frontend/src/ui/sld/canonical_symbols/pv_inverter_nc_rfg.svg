<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- PV inverter with NC RfG compliance markers / Falownik PV z parametrami NC RfG — IEC 60617 + Annex II Reg. (EU) 2016/631 -->
  <!-- Standard inverter (DC/AC) with NC RfG annotation badge for FRT/Q-U/cos φ(P). -->
  <!-- Inverter body (square) -->
  <rect x="25" y="25" width="50" height="50" fill="none" stroke="currentColor" stroke-width="3"/>
  <!-- DC/AC waveforms inside -->
  <line x1="32" y1="40" x2="48" y2="40" stroke="currentColor" stroke-width="2"/>
  <path d="M 52 40 Q 56 32 60 40 Q 64 48 68 40" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Diagonal divider -->
  <line x1="32" y1="68" x2="68" y2="32" stroke="currentColor" stroke-width="1.5"/>
  <!-- Bottom row: DC -->
  <text x="32" y="62" font-family="sans-serif" font-size="7" fill="currentColor">DC</text>
  <!-- Top row: AC -->
  <text x="56" y="40" font-family="sans-serif" font-size="7" fill="currentColor">AC</text>
  <!-- NC RfG compliance badge (top right) -->
  <rect x="68" y="8" width="28" height="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="71" y="18" font-family="sans-serif" font-size="6" font-weight="bold" fill="currentColor">NC RfG</text>
  <!-- Top connection (DC side, to PV array) -->
  <line x1="50" y1="0" x2="50" y2="25" stroke="currentColor" stroke-width="3"/>
  <!-- Bottom connection (AC side, to grid) -->
  <line x1="50" y1="75" x2="50" y2="100" stroke="currentColor" stroke-width="3"/>
  <!-- Ports: top (50, 0) DC input from PV, bottom (50, 100) AC output to grid -->
</svg>
