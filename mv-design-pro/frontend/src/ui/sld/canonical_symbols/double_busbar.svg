<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Double busbar / Szyna dwusystemowa (S1 + S2 independent with coupler) - IEC 60617 -->
  <!-- Two independent parallel busbars without ring closure (operator selects which system per bay) -->
  <!-- S1 (main / główna) -->
  <rect x="5" y="30" width="90" height="6" fill="none" stroke="currentColor" stroke-width="3"/>
  <!-- S2 (auxiliary / pomocnicza) -->
  <rect x="5" y="64" width="90" height="6" fill="none" stroke="currentColor" stroke-width="3"/>
  <!-- Section identifier markers -->
  <text x="2" y="28" font-family="sans-serif" font-size="8" fill="currentColor">S1</text>
  <text x="2" y="80" font-family="sans-serif" font-size="8" fill="currentColor">S2</text>
  <!-- Ports:
       left_s1: (0, 33), right_s1: (100, 33)
       left_s2: (0, 67), right_s2: (100, 67) -->
</svg>
