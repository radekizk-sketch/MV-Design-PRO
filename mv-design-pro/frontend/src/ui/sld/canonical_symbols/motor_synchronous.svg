<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Synchronous motor / Silnik synchroniczny — IEC 60617 -->
  <!-- Synchronous motor representation: circle with "MS" or "M" + field winding marker. -->
  <!-- Top connection (3-phase supply) -->
  <line x1="50" y1="0" x2="50" y2="20" stroke="currentColor" stroke-width="3"/>
  <!-- Motor circle -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="currentColor" stroke-width="3"/>
  <!-- "MS" letters (synchronous motor) -->
  <text x="50" y="52" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="currentColor">MS</text>
  <!-- Field marker — "=" indicating DC excitation -->
  <text x="50" y="68" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="currentColor">3~/=</text>
  <!-- Excitation slip rings (two small circles on left + right) -->
  <circle cx="22" cy="50" r="2" fill="currentColor"/>
  <circle cx="78" cy="50" r="2" fill="currentColor"/>
  <!-- Earth connection at bottom -->
  <line x1="50" y1="80" x2="50" y2="92" stroke="currentColor" stroke-width="2"/>
  <line x1="44" y1="92" x2="56" y2="92" stroke="currentColor" stroke-width="2"/>
  <line x1="46" y1="96" x2="54" y2="96" stroke="currentColor" stroke-width="2"/>
  <!-- Ports: top (50, 0) 3-phase connection -->
</svg>
