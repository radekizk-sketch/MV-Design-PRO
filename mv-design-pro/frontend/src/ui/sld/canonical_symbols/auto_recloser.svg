<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Auto-recloser / PPZ (samoczynne ponowne załączenie) — IEC 60617 + ANSI 79 marker -->
  <!-- Circuit breaker with auto-reclose function (ANSI 79). -->
  <!-- CB body (X open-state) -->
  <rect x="30" y="30" width="40" height="40" fill="none" stroke="currentColor" stroke-width="3"/>
  <line x1="30" y1="30" x2="70" y2="70" stroke="currentColor" stroke-width="2"/>
  <line x1="70" y1="30" x2="30" y2="70" stroke="currentColor" stroke-width="2"/>
  <!-- Auto-reclose arrow (curved circular arrow above CB) -->
  <path d="M 38 18 A 14 10 0 1 1 62 18" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Arrow head -->
  <polyline points="60,14 62,18 66,16" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- ANSI 79 number marker -->
  <text x="42" y="25" font-family="sans-serif" font-size="7" fill="currentColor" font-weight="bold">79</text>
  <!-- Connection stubs -->
  <line x1="50" y1="0" x2="50" y2="30" stroke="currentColor" stroke-width="3"/>
  <line x1="50" y1="70" x2="50" y2="100" stroke="currentColor" stroke-width="3"/>
  <!-- Ports: top: (50, 0), bottom: (50, 100) -->
</svg>
