<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Grounding resistor / Rezystor uziemiający — IEC 60617 -->
  <!-- Resistor rectangle connecting neutral to earth. -->
  <!-- Top connection (to neutral) -->
  <line x1="50" y1="5" x2="50" y2="25" stroke="currentColor" stroke-width="3"/>
  <!-- Resistor body (rectangle) -->
  <rect x="35" y="25" width="30" height="40" fill="none" stroke="currentColor" stroke-width="3"/>
  <!-- Zigzag inside (optional ANSI alternative) -->
  <polyline points="40,32 48,38 40,46 48,52 40,58" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <!-- Connection to earth -->
  <line x1="50" y1="65" x2="50" y2="78" stroke="currentColor" stroke-width="3"/>
  <!-- Earth symbol -->
  <line x1="40" y1="78" x2="60" y2="78" stroke="currentColor" stroke-width="3"/>
  <line x1="44" y1="84" x2="56" y2="84" stroke="currentColor" stroke-width="2"/>
  <line x1="48" y1="90" x2="52" y2="90" stroke="currentColor" stroke-width="2"/>
  <!-- Label R -->
  <text x="68" y="48" font-family="sans-serif" font-size="10" font-weight="bold" fill="currentColor">R</text>
  <!-- Ports: top: (50, 0) neutral connection; bottom is earth (not routed) -->
</svg>
