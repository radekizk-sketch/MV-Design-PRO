<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Transformer 2W with OLTC tap changer / Transformator 2W z OLTC — IEC 60617 -->
  <!-- Two-winding transformer (overlapping circles) with diagonal arrow indicating tap changer. -->
  <!-- Top connection (HV side) -->
  <line x1="50" y1="5" x2="50" y2="25" stroke="currentColor" stroke-width="3"/>
  <!-- HV winding circle -->
  <circle cx="50" cy="38" r="18" fill="none" stroke="currentColor" stroke-width="3"/>
  <!-- LV winding circle -->
  <circle cx="50" cy="62" r="18" fill="none" stroke="currentColor" stroke-width="3"/>
  <!-- OLTC arrow (diagonal arrow through HV winding indicating tap changer) -->
  <line x1="68" y1="22" x2="32" y2="54" stroke="currentColor" stroke-width="2"/>
  <polyline points="34,48 32,54 38,52" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Bottom connection (LV side) -->
  <line x1="50" y1="80" x2="50" y2="95" stroke="currentColor" stroke-width="3"/>
  <!-- "OLTC" label -->
  <text x="72" y="38" font-family="sans-serif" font-size="7" fill="currentColor">OLTC</text>
  <!-- Ports: top (50, 0) HV, bottom (50, 100) LV -->
</svg>
