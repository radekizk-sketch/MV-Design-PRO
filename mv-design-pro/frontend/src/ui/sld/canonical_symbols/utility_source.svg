<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Utility source (External Grid) / Sieć zewnętrzna — IEC 60617 -->
  <!-- Standard external grid symbol: circle with "U" or grid pattern. -->
  <!-- Grid representation: circle with internal radiating lines (sun-like) -->
  <circle cx="50" cy="40" r="22" fill="none" stroke="currentColor" stroke-width="3"/>
  <!-- Radiating lines inside circle -->
  <line x1="50" y1="22" x2="50" y2="32" stroke="currentColor" stroke-width="2"/>
  <line x1="50" y1="48" x2="50" y2="58" stroke="currentColor" stroke-width="2"/>
  <line x1="32" y1="40" x2="42" y2="40" stroke="currentColor" stroke-width="2"/>
  <line x1="58" y1="40" x2="68" y2="40" stroke="currentColor" stroke-width="2"/>
  <line x1="37" y1="27" x2="44" y2="34" stroke="currentColor" stroke-width="2"/>
  <line x1="56" y1="46" x2="63" y2="53" stroke="currentColor" stroke-width="2"/>
  <line x1="63" y1="27" x2="56" y2="34" stroke="currentColor" stroke-width="2"/>
  <line x1="44" y1="46" x2="37" y2="53" stroke="currentColor" stroke-width="2"/>
  <!-- Connection downward -->
  <line x1="50" y1="62" x2="50" y2="100" stroke="currentColor" stroke-width="3"/>
  <!-- Label -->
  <text x="40" y="78" font-family="sans-serif" font-size="7" fill="currentColor">GRID</text>
  <!-- Ports: bottom (50, 100) point of common coupling to grid -->
</svg>
